    trainingTagAnlegen, trainingTagOben, trainingUebungAnlegen,
    trainingUebungLoeschen, trainingSatz, trainingSatzWeg,
  };
}

</script>
<script>
// ===APP-START===
// Dashboard Mobile: Oberflaeche und GitHub-Anbindung.
// Der Kern (Parser und Schreiblogik) steht in core.js und ist 1:1 aus
// generate.py und aktionen.py portiert.
"use strict";

// ------------------------------------------------------------- Helfer

const $ = (sel) => document.querySelector(sel);
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function verlinke(s) {
  // Nur fuers Anzeigen: nackte Adressen anklickbar machen.
  return esc(s).replace(/(https?:\/\/[^\s<>"']+)/g,
    (u) => '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>");
}
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
  "August", "September", "Oktober", "November", "Dezember"];
function kurzDatum(d) {
  const p = (x) => String(x).padStart(2, "0");
  return WOCHENTAGE[weekday(d)] + " " + p(d.getUTCDate()) + "." + p(d.getUTCMonth() + 1) + ".";
}
function langDatum(d) {
  return WOCHENTAGE[weekday(d)] + ", " + d.getUTCDate() + ". " + MONATE[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

let toastTimer = null;
function toast(text, fehler) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "sichtbar" + (fehler ? " rot" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, fehler ? 5000 : 2600);
}

function sheetOeffnen(html) {
  $("#sheetinhalt").innerHTML = html;
  $("#schleier").classList.add("offen");
}
function sheetZu() {
  $("#schleier").classList.remove("offen");
  $("#sheetinhalt").innerHTML = "";
}

// ------------------------------------------------- Einstellungen, Ablage

const VERSION = 4;

const CFG_KEY = "dashmobil-cfg";
const CACHE_KEY = "dashmobil-cache";

let cfg = { owner: "ReapreZ", repo: "obsidian-vault", branch: "main", token: "" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); } catch (e) { /* egal */ }
function cfgSpeichern() { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

// ablage: pfad -> {text, sha}
let ablage = new Map();
let todoNamen = [];       // Dateinamen Dashboard/Todos*.md in fester Reihenfolge
let tagebuchNamen = [];   // JJJJ.MM.TT.md, aufsteigend
let stand = null;         // Zeitpunkt des letzten erfolgreichen Ladens

function cacheSpeichern() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      ablage: Array.from(ablage.entries()), todoNamen, tagebuchNamen, stand,
    }));
  } catch (e) { /* Speicher voll, egal */ }
}
function cacheLaden() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!c) return false;
    ablage = new Map(c.ablage);
    todoNamen = c.todoNamen || [];
    tagebuchNamen = c.tagebuchNamen || [];
    stand = c.stand || null;
    return ablage.size > 0;
  } catch (e) { return false; }
}

// --------------------------------------------------------- GitHub-API

const API = "https://api.github.com";

function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function b64enc(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function apiPfad(pfad) {
  return pfad.split("/").map(encodeURIComponent).join("/");
}

async function api(weg, opts) {
  if (!cfg.token) { const e = new Error("Kein Token hinterlegt"); e.keinToken = true; throw e; }
  // cache no-store: GitHub schickt private Antworten mit max-age 60, sonst
  // zeigt ein Aktualisieren direkt nach dem Schreiben wieder den alten Stand.
  const r = await fetch(API + "/repos/" + cfg.owner + "/" + cfg.repo + weg, Object.assign({
    cache: "no-store",
    headers: {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    },
  }, opts || {}));
  if (r.status === 404) { const e = new Error("404"); e.fehlt = true; throw e; }
  if (r.status === 401) { const e = new Error("Token ungültig oder abgelaufen"); e.keinToken = true; throw e; }
  if (r.status === 409 || r.status === 422) {
    const e = new Error("Konflikt"); e.konflikt = true; throw e;
  }
  if (!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}

async function ladeDatei(pfad) {
  try {
    const d = await api("/contents/" + apiPfad(pfad) + "?ref=" + cfg.branch);
    const eintrag = { text: b64dec(d.content), sha: d.sha };
    ablage.set(pfad, eintrag);
    return eintrag;
  } catch (e) {
    if (e.fehlt) { const leer = { text: "", sha: null }; ablage.set(pfad, leer); return leer; }
    throw e;
  }
}

async function holeDatei(pfad) {
  return ablage.get(pfad) || ladeDatei(pfad);
}

async function ladeOrdner(pfad) {
  return api("/contents/" + apiPfad(pfad) + "?ref=" + cfg.branch);
}

async function putDatei(pfad, text, nachricht) {
  const alt = ablage.get(pfad);
  const body = { message: nachricht, content: b64enc(text), branch: cfg.branch };
  if (alt && alt.sha) body.sha = alt.sha;
  const d = await api("/contents/" + apiPfad(pfad), {
    method: "PUT", body: JSON.stringify(body),
  });
  ablage.set(pfad, { text, sha: d.content.sha });
}

// Fuehrt rechne(texte) aus und schreibt alle geaenderten Dateien.
// Bei einem sha-Konflikt wird frisch geladen und neu gerechnet.
async function transaktion(pfade, rechne, nachricht) {
  for (let versuch = 0; versuch < 3; versuch++) {
    const texte = {};
    for (const p of pfade) texte[p] = (await holeDatei(p)).text;
    const out = rechne(texte);
    try {
      for (const p of Object.keys(out)) {
        if (out[p] !== null && out[p] !== nl(texte[p])) {
          await putDatei(p, out[p], nachricht);
        }
      }
      cacheSpeichern();
      return;
    } catch (e) {
      if (e.konflikt) { for (const p of pfade) ablage.delete(p); continue; }
      throw e;
    }
  }
  throw new Error("Dauerkonflikt, bitte einmal neu laden");
}

async function alleNotizNamen() {
  const d = await api("/git/trees/" + encodeURIComponent(cfg.branch) + "?recursive=1");
  const map = new Map();
  for (const e of d.tree || []) {
    if (e.type !== "blob" || !e.path.endsWith(".md")) continue;
    if (/(^|\/)(\.obsidian|\.git|\.trash)\//.test(e.path)) continue;
    const name = e.path.split("/").pop().slice(0, -3);
    if (!map.has(name.toLowerCase())) map.set(name.toLowerCase(), name);
  }
  return map;
}

// ------------------------------------------------------------- Laden

let laedt = false;

async function aktualisieren(leise) {
  if (laedt) return;
  if (!cfg.token) { einstellungenSheet(true); return; }
  laedt = true;
  $("#syncknopf").classList.add("dreht");
  try {
    const dash = await ladeOrdner("Dashboard");
    const namen = dash.filter((e) => e.type === "file" && /^Todos.*\.md$/.test(e.name))
      .map((e) => e.name).sort();
    if (namen.includes("Todos.md")) {
      namen.splice(namen.indexOf("Todos.md"), 1);
      namen.unshift("Todos.md");
    }
    todoNamen = namen;

    const feste = ["Dashboard/Kalender.md", "Dashboard/Habits.md",
      "Dashboard/Schichten.md", "Dashboard/Gesundheit.md",
      "Dashboard/Sozial.md", "Dashboard/Training.md",
      "Dashboard/Schlagworte.md"];
    await Promise.all(
      namen.map((n) => ladeDatei("Dashboard/" + n)).concat(feste.map(ladeDatei)));

    const tb = await ladeOrdner("Tagebuch").catch(() => []);
    tagebuchNamen = tb.filter((e) => e.type === "file" && /^\d{4}\.\d{2}\.\d{2}\.md$/.test(e.name))
      .map((e) => e.name).sort();
    // Heutigen Eintrag plus die letzten Eintraege laden. Fuer die Ziele
    // rueckwaerts in Paketen nachladen, bis welche gefunden sind, wie
    // letzte_ziele am PC (das liest einfach alle).
    const laden = new Set(tagebuchNamen.slice(-7));
    laden.add(punktDatum(heute()) + ".md");
    await Promise.all(Array.from(laden)
      .filter((n) => tagebuchNamen.includes(n))
      .map((n) => ladeDatei("Tagebuch/" + n)));
    let tiefe = 7;
    while (!letzteZiele(tagebuchEintraege()) && tiefe < tagebuchNamen.length && tiefe < 60) {
      const paket = tagebuchNamen.slice(-(tiefe + 8), -tiefe);
      if (!paket.length) break;
      await Promise.all(paket.map((n) => ladeDatei("Tagebuch/" + n)));
      tiefe += 8;
    }

    stand = Date.now();
    cacheSpeichern();
    renderAlles();
    if (!leise) toast("Aktualisiert");
  } catch (e) {
    if (e.keinToken) { einstellungenSheet(true); }
    else toast("Laden fehlgeschlagen: " + e.message + (stand ? ". Zeige letzten Stand." : ""), true);
  } finally {
    laedt = false;
    $("#syncknopf").classList.remove("dreht");
  }
}

// ------------------------------------------------------ Abgeleitetes

function text(pfad) { return (ablage.get(pfad) || { text: "" }).text; }

function todoDateien() {
  return todoNamen.map((datei) => ({ datei, text: text("Dashboard/" + datei) }));
}
function alleTodos() { return parseTodos(todoDateien()); }
function tagebuchEintraege() {
  const raus = [];
  for (const n of tagebuchNamen) {
    if (!ablage.has("Tagebuch/" + n)) continue;
    const d = parseDate(n.slice(0, -3));
    if (d) raus.push({ datum: d, text: text("Tagebuch/" + n) });
  }
  raus.sort((a, b) => a.datum - b.datum);
  return raus;
}

// ------------------------------------------------------------ Render

let aktTab = "heute";
let kalMonat = null;   // erster Tag des angezeigten Monats
let kalTag = null;     // ausgewaehlter Tag
let tbTag = null;      // Tagebuch-Datum

function renderAlles() {
  $("#kopfdatum").textContent = langDatum(heute());
  $("#standzeile").textContent = (stand
    ? "Stand " + new Date(stand).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    : "Noch nichts geladen") + " · Version " + VERSION;
  renderHeute();
  renderKalender();
  renderTagebuch();
  renderTraining();
  renderSozial();
}

// ------------------------------------------------------------- Heute

function todoZeileHtml(t, mitFaellig) {
  const idx = "data-datei=\"" + esc(t.datei) + "\" data-raw=\"" + esc(t.raw) + "\"";
  let meta = "<span>" + esc(t.liste) + " / " + esc(t.sektion) + "</span>";
  if (t.prio) meta += "<span class=\"prio " + t.prio + "\">" + PRIO_LABEL[t.prio] + "</span>";
  if (t.due && mitFaellig) {
    const n = tageDiff(t.due, heute());
    const cls = n < 0 ? "ueberfaellig" : n === 0 ? "heutefaellig" : "";
    meta += "<span class=\"" + cls + "\">" + esc(faelligText(t.due)) + "</span>";
  } else if (t.due) {
    meta += "<span>@" + iso(t.due) + "</span>";
  }
  return "<div class=\"todo\">" +
    "<button class=\"kreis\" data-aktion=\"todo-menue\" " + idx + " aria-label=\"abhaken\"></button>" +
    "<div class=\"inhalt\" data-aktion=\"todo-menue\" " + idx + ">" +
    "<div class=\"text\">" + verlinke(t.text) + "</div>" +
    "<div class=\"meta\">" + meta + "</div></div></div>";
}

function renderHeute() {
  const b = [];
  const h = heute();
  const cfgS = parseSchichten(text("Dashboard/Schichten.md"));
  const heuteS = schichtAm(h, cfgS);
  const morgenS = schichtAm(addDays(h, 1), cfgS);

  b.push("<div class=\"karte\"><h3>Schicht</h3><div class=\"schichtzeile\">");
  if (heuteS) {
    b.push("<span class=\"name\">" + esc(heuteS.name) + "</span>" +
      "<span class=\"zeit\">" + esc(heuteS.von) + " bis " + esc(heuteS.bis) + "</span>");
  } else {
    b.push("<span class=\"name\">Frei</span>");
  }
  b.push("<span class=\"morgen\">morgen<br>" + esc(morgenS ? morgenS.name : "frei") + "</span>");
  b.push("</div></div>");

  const todos = alleTodos().filter((t) => !t.done);
  const faellig = todos.filter((t) => t.due && tageDiff(t.due, h) <= 0);
  faellig.sort((x, y) => (x.due - y.due) || (PRIO_RANK[x.prio] - PRIO_RANK[y.prio]));
  b.push("<div class=\"karte\"><h3>Fällig <span class=\"zusatz\">" + faellig.length + " offen</span></h3>");
  if (faellig.length) b.push(faellig.map((t) => todoZeileHtml(t, true)).join(""));
  else b.push("<div class=\"leer\">Nichts fällig. Prag wartet.</div>");
  b.push("</div>");

  // Habits
  const habits = parseHabits(text("Dashboard/Habits.md"));
  const heuteHabits = habits[iso(h)] || [];
  const bekannt = Object.keys(HABIT_LABEL);
  const extra = heuteHabits.filter((x) => !bekannt.includes(x));
  b.push("<div class=\"karte\"><h3>Habits <span class=\"zusatz\">" + heuteHabits.length + " heute</span></h3><div class=\"chips\">");
  for (const k of bekannt.concat(extra)) {
    const an = heuteHabits.includes(k);
    const s = streak(habits, k);
    b.push("<button class=\"chip" + (an ? " an" : "") + "\" data-aktion=\"habit\" data-habit=\"" + esc(k) + "\">" +
      esc(HABIT_LABEL[k] || k) + (s > 1 ? "<span class=\"strk\">" + s + "×</span>" : "") + "</button>");
  }
  b.push("</div></div>");

  // Supplemente und Wasser
  const ges = parseGesundheit(text("Dashboard/Gesundheit.md"));
  const logHeute = ges.log[iso(h)] || {};
  const suppHeute = logHeute.supp || [];
  const dran = ges.supplemente.filter((s) => suppFaellig(s, h));
  const rest = ges.supplemente.filter((s) => !suppFaellig(s, h));
  const offen = dran.filter((s) => !suppHeute.includes(s.key)).length;
  b.push("<div class=\"karte\"><h3>Supplemente <span class=\"zusatz\">" +
    (offen ? offen + " offen" : "alle genommen") + "</span></h3><div class=\"chips\">");
  for (const s of dran) {
    b.push("<button class=\"chip" + (suppHeute.includes(s.key) ? " an" : "") + "\" data-aktion=\"supp\" data-supp=\"" + esc(s.key) + "\">" + esc(s.label) + "</button>");
  }
  b.push("</div>");
  if (rest.length) {
    b.push("<div class=\"leisezeile\">Heute nicht dran:<div class=\"chips\">");
    for (const s of rest) {
      b.push("<button class=\"chip leise" + (suppHeute.includes(s.key) ? " an" : "") + "\" data-aktion=\"supp\" data-supp=\"" + esc(s.key) + "\">" +
        esc(s.label) + " · " + esc(suppWann(s)) + "</button>");
    }
    b.push("</div></div>");
  }
  const wasser = parseFloat(logHeute.wasser || 0) || 0;
  const ziel = ges.ziele.wasser || 8;
  let glaeser = "";
  for (let i = 0; i < Math.max(ziel, wasser); i++) glaeser += i < wasser ? "●" : "○";
  b.push("<div class=\"wasser\"><button data-aktion=\"wasser\" data-wert=\"-1\">−</button>" +
    "<span class=\"stand\">Wasser " + wasser + " von " + ziel + "</span>" +
    "<span class=\"glaeser\">" + glaeser + "</span>" +
    "<button class=\"plus\" data-aktion=\"wasser\" data-wert=\"1\">+</button></div>");
  b.push("</div>");

  // Naechste Termine
  const termine = parseKalender(text("Dashboard/Kalender.md"))
    .filter((t) => t.datum >= h).slice(0, 5);
  b.push("<div class=\"karte\"><h3>Nächste Termine</h3>");
  if (termine.length) {
    for (const t of termine) {
      b.push("<div class=\"termin\" data-aktion=\"termin-menue\" data-datum=\"" + iso(t.datum) + "\" data-titel=\"" + esc(t.titel) + "\">" +
        "<span class=\"wann\">" + kurzDatum(t.datum) + "</span>" +
        "<span class=\"titel\">" + verlinke(t.titel) +
        (t.zeit ? " <span class=\"zeit\">" + esc(t.zeit) + "</span>" : "") + "</span></div>");
    }
  } else b.push("<div class=\"leer\">Keine Termine.</div>");
  b.push("</div>");

  // Ziele fuer morgen
  const lz = letzteZiele(tagebuchEintraege());
  if (lz) {
    b.push("<div class=\"karte\"><h3>Ziele aus dem Tagebuch <span class=\"zusatz\">vom " + kurzDatum(lz.datum) + "</span></h3>");
    for (const z of lz.ziele) b.push("<div class=\"todo\"><div class=\"inhalt\"><div class=\"text\">" + verlinke(z.replace(/^[-*]\s*/, "")) + "</div></div></div>");
    b.push("</div>");
  }

  // Alle Todos nach Liste
  const listen = todoListen(todoDateien());
  b.push("<div class=\"karte\"><h3>Alle Todos</h3>");
  const alle = alleTodos().filter((t) => !t.done);
  for (const l of listen) {
    const eigene = alle.filter((t) => t.datei === l.datei);
    b.push("<details class=\"liste-details\"><summary><span class=\"pfeil\">▶</span>" + esc(l.liste) +
      "<span class=\"anzahl\">" + eigene.length + "</span></summary>");
    for (const sek of l.sektionen) {
      const st = eigene.filter((t) => t.sektion === sek);
      if (!st.length) continue;
      b.push("<div class=\"sektionstitel\">" + esc(sek) + "</div>");
      b.push(st.map((t) => todoZeileHtml(t, false)).join(""));
    }
    b.push("</details>");
  }
  b.push("</div>");

  $("#blatt-heute").innerHTML = b.join("");
}

// ----------------------------------------------------------- Kalender

function renderKalender() {
  const h = heute();
  if (!kalMonat) kalMonat = makeDate(h.getUTCFullYear(), h.getUTCMonth() + 1, 1);
  if (!kalTag) kalTag = h;
  const cfgS = parseSchichten(text("Dashboard/Schichten.md"));
  const termine = parseKalender(text("Dashboard/Kalender.md"));
  const todos = alleTodos().filter((t) => !t.done && t.due);

  const proTag = {};
  for (const t of termine) (proTag[iso(t.datum)] = proTag[iso(t.datum)] || []).push(t);
  const todosTag = {};
  for (const t of todos) (todosTag[iso(t.due)] = todosTag[iso(t.due)] || []).push(t);

  const b = [];
  b.push("<div class=\"kalkopf\"><button data-aktion=\"kal-monat\" data-schritt=\"-1\">‹</button>" +
    "<span class=\"monat\">" + MONATE[kalMonat.getUTCMonth()] + " " + kalMonat.getUTCFullYear() + "</span>" +
    "<button data-aktion=\"kal-monat\" data-schritt=\"1\">›</button></div>");
  b.push("<div class=\"kalgitter\">");
  for (const w of WOCHENTAGE) b.push("<div class=\"wt\">" + w + "</div>");
  const start = addDays(kalMonat, -weekday(kalMonat));
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const fremd = d.getUTCMonth() !== kalMonat.getUTCMonth();
    const s = schichtAm(d, cfgS);
    const cls = ["kaltag", fremd ? "fremd" : "", gleich(d, h) ? "heute" : "",
      gleich(d, kalTag) ? "gewaehlt" : ""].filter(Boolean).join(" ");
    let punkte = "";
    if ((proTag[iso(d)] || []).length) punkte += "<span class=\"punkt\"></span>";
    if ((todosTag[iso(d)] || []).length) punkte += "<span class=\"punkt fael\"></span>";
    b.push("<button class=\"" + cls + "\" data-aktion=\"kal-tag\" data-datum=\"" + iso(d) + "\">" +
      "<span>" + d.getUTCDate() + "</span>" +
      "<span class=\"schichtk\">" + (s ? esc(s.name[0]) : "") + "</span>" +
      "<span class=\"punkte\">" + punkte + "</span></button>");
  }
  b.push("</div>");

  const s = schichtAm(kalTag, cfgS);
  b.push("<div class=\"karte\" style=\"margin-top:12px\"><h3>" + esc(kurzDatum(kalTag)) +
    " <span class=\"zusatz\">" + esc(s ? s.name + " " + s.von + " bis " + s.bis : "frei") + "</span></h3>");
  const tt = proTag[iso(kalTag)] || [];
  const td = todosTag[iso(kalTag)] || [];
  if (!tt.length && !td.length) b.push("<div class=\"leer\">Nichts an dem Tag.</div>");
  for (const t of tt) {
    b.push("<div class=\"termin\" data-aktion=\"termin-menue\" data-datum=\"" + iso(t.datum) + "\" data-titel=\"" + esc(t.titel) + "\">" +
      "<span class=\"wann\">" + (t.zeit ? esc(t.zeit) : "Termin") + "</span>" +
      "<span class=\"titel\">" + verlinke(t.titel) +
      (t.notiz ? " <span class=\"zeit\">" + verlinke(t.notiz) + "</span>" : "") + "</span></div>");
  }
  if (td.length) {
    b.push("<div class=\"sektionstitel\">Fällige Todos</div>");
    b.push(td.map((t) => todoZeileHtml(t, false)).join(""));
  }
  b.push("<div style=\"margin-top:10px\"><button class=\"knopf zweit\" data-aktion=\"termin-neu\">+ Termin am " + kurzDatum(kalTag) + "</button></div>");
  b.push("</div>");

  $("#blatt-kalender").innerHTML = b.join("");
}

// ----------------------------------------------------------- Tagebuch

let tbDirty = false;      // Nutzer tippt gerade im Editor
let tbRenderTag = null;   // Tag, fuer den der Editor gerade gefuellt ist

function renderTagebuch() {
  if (!tbTag) tbTag = heute();
  // Waehrend Can tippt, nichts ueberschreiben (renderAlles laeuft auch
  // nach Habit-Klicks und so weiter).
  if (tbDirty && tbRenderTag && gleich(tbTag, tbRenderTag) && $("#tbedit")) return;

  const pfad = "Tagebuch/" + punktDatum(tbTag) + ".md";
  const vorhanden = tagebuchNamen.includes(punktDatum(tbTag) + ".md");
  const inhalt = ablage.has(pfad) ? text(pfad) : null;

  const b = [];
  b.push("<div class=\"tbnav\"><button data-aktion=\"tb-tag\" data-schritt=\"-1\">‹</button>" +
    "<span class=\"datum\">" + langDatum(tbTag) + "</span>" +
    "<button data-aktion=\"tb-tag\" data-schritt=\"1\"" + (gleich(tbTag, heute()) ? " disabled" : "") + ">›</button></div>");

  if (vorhanden && inhalt === null) {
    b.push("<div class=\"karte\"><div class=\"leer\">Eintrag existiert, aber noch nicht geladen.</div>" +
      "<button class=\"knopf zweit\" data-aktion=\"tb-laden\" style=\"margin-top:8px\">Laden</button></div>");
  } else {
    b.push("<div class=\"karte\"><h3>Eintrag" +
      (inhalt === null || !inhalt.trim() ? " <span class=\"zusatz\">noch leer</span>" : "") + "</h3>" +
      "<textarea id=\"tbedit\" class=\"tbedit\" placeholder=\"Was war heute? [wort] wird zum Wikilink, Schlagworte verlinken sich von selbst.\">" +
      esc(inhalt === null ? "" : nl(inhalt)) + "</textarea>" +
      (inhalt === null || !inhalt.trim()
        ? "<button class=\"knopf zweit\" data-aktion=\"tb-vorlage\" style=\"margin-bottom:9px\">Vorlage einfügen</button>"
        : "") +
      "<button class=\"knopf\" data-aktion=\"tb-voll-speichern\">Speichern</button>" +
      "<div class=\"hilfetext\" style=\"margin-top:8px\">Du editierst direkt die Datei, wie am PC. " +
      "Jeder Stand landet als Commit in git, nichts geht verloren.</div></div>");
  }

  $("#blatt-tagebuch").innerHTML = b.join("");
  tbRenderTag = tbTag;
  tbDirty = false;
  const ta = $("#tbedit");
  if (ta) ta.addEventListener("input", () => { tbDirty = true; });
}

  for (const s of daten.stufen) {

      s.stufe + " · " + esc(s.uebung) + "</option>");

      "<div class=\"wert\"><div class=\"zahl\">" + bilanz.nachher.toFixed(1) + "</div><div class=\"label\">erlebt</div></div>" +

    }

  $("#blatt-sozial").innerHTML = b.join("");

// ---------------------------------------------------------- Training

let trEingaben = {};   // uebung -> {gew, wdh}, damit die Felder beim
                       // Neuzeichnen nach jedem Satz gefuellt bleiben

function trainingWann(d) {
  const n = tageDiff(heute(), d);
  if (n === 0) return "heute";
  if (n === 1) return "gestern";
  return "vor " + n + " Tagen";
}

function trainingSaetzeKurz(saetze) {
  return saetze.map(trainingSatzText).join(", ");
}

function renderTraining() {
  const d = parseTraining(text("Dashboard/Training.md"));
  const h = iso(heute());
  const b = [];

  b.push("<div class=\"karte\"><h3>Trainingstage</h3>");
  if (d.tage.length) {
    b.push("<div class=\"chips\">");
    d.tage.forEach((t, n) => {
      b.push("<button class=\"chip" + (n === 0 ? " an" : "") + "\" data-aktion=\"training-tag-oben\" data-tag=\"" + esc(t) + "\"" + (n === 0 ? " data-oben=\"1\"" : "") + ">" + esc(t) + "</button>");
    });
    b.push("<button class=\"chip leise\" data-aktion=\"training-tag-neu\">+ Tag</button>");
    b.push("</div>");
    b.push("<div class=\"hilfetext\" style=\"margin-top:8px\">Tippen schiebt den Tag nach ganz oben, der oberste ist dein aktueller Tag.</div>");
  } else {
    b.push("<div class=\"hilfetext\">Noch keine Trainingstage. Leg den ersten an, zum Beispiel Push.</div>");
    b.push("<button class=\"knopf zweit\" data-aktion=\"training-tag-neu\" style=\"margin-top:8px\">+ Trainingstag anlegen</button>");
  }
  b.push("</div>");

  if (d.tage.length) {
    const akt = d.tage[0];
    const uebungen = d.uebungen[akt] || [];
    if (!uebungen.length) {
      b.push("<div class=\"karte\"><h3>" + esc(akt) + "</h3><div class=\"hilfetext\">Noch keine Übungen für " + esc(akt) + ". Leg unten die erste an.</div></div>");
    }
    for (const u of uebungen) {
      const eintraege = d.log.filter((x) => x.uebung.toLowerCase() === u.toLowerCase());
      let heuteE = null;
      for (const x of eintraege) {
        if (iso(x.datum) === h && x.tag.toLowerCase() === akt.toLowerCase()) heuteE = x;
      }
      const frueher = eintraege.filter((x) => iso(x.datum) !== h);
      const gewichte = [];
      for (const x of eintraege) {
        for (const s of x.saetze) if (s.gewicht !== null) gewichte.push(s.gewicht);
      }
      const bestes = gewichte.length ? Math.max.apply(null, gewichte) : null;

      b.push("<div class=\"karte\"><h3>" + esc(u) +
        (bestes !== null ? " <span class=\"zusatz\">Bestes " + trainingGewichtText(bestes) + " kg</span>" : "") + "</h3>");
      if (frueher.length) {
        const x = frueher[frueher.length - 1];
        b.push("<div class=\"hilfetext\">Letztes Mal " + trainingWann(x.datum) + ": " + esc(trainingSaetzeKurz(x.saetze)) + "</div>");
      }
      if (heuteE) {
        b.push("<div class=\"trsaetze\">" + heuteE.saetze.map(
          (s) => "<span class=\"trsatz\">" + esc(trainingSatzText(s)) + "</span>").join("") + "</div>");
      }
      const eing = trEingaben[u] || {};
      b.push("<div class=\"zeile2\"><div><label class=\"feld\">Gewicht in kg, leer ohne</label>" +
        "<input type=\"number\" step=\"0.25\" inputmode=\"decimal\" class=\"tr-gew\" value=\"" + esc(eing.gew || "") + "\"></div>" +
        "<div><label class=\"feld\">Wiederholungen</label>" +
        "<input type=\"number\" inputmode=\"numeric\" class=\"tr-wdh\" value=\"" + esc(eing.wdh || "") + "\"></div></div>");
      b.push("<button class=\"knopf\" data-aktion=\"training-satz\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\">+ Satz eintragen</button>");
      if (heuteE) {
        b.push("<button class=\"knopf zweit\" data-aktion=\"training-satz-weg\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\" style=\"margin-top:8px\">Letzten Satz rausnehmen</button>");
      }
      b.push("<details class=\"liste-details\" style=\"margin-top:8px\"><summary><span class=\"pfeil\">▶</span>Verlauf<span class=\"anzahl\">" +
        eintraege.length + (eintraege.length === 1 ? " Einheit" : " Einheiten") + "</span></summary>");
      for (const x of eintraege.slice(-10).reverse()) {
        b.push("<div class=\"logzeile\"><div class=\"kopf\"><span class=\"datum\">" + kurzDatum(x.datum) + "</span>" +
          "<span>" + esc(x.tag) + "</span>" +
          "<span class=\"zahlen\">" + esc(trainingSaetzeKurz(x.saetze)) + "</span></div></div>");
      }
      b.push("<button class=\"knopf zweit\" data-aktion=\"training-uebung-weg\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\" style=\"margin-top:8px\">Übung aus dem Plan nehmen</button>");
      b.push("</details></div>");
    }

    b.push("<div class=\"karte\"><h3>Übung hinzufügen <span class=\"zusatz\">" + esc(akt) + "</span></h3>" +
      "<input type=\"text\" id=\"tr-neuueb\" placeholder=\"Name der Übung\">" +
      "<button class=\"knopf\" data-aktion=\"training-uebung-neu\" data-tag=\"" + esc(akt) + "\" style=\"margin-top:8px\">Hinzufügen</button></div>");
  }

  if (d.log.length) {
    const gruppen = new Map();
    for (const x of d.log) {
      const k = iso(x.datum) + "|" + x.tag;
      if (!gruppen.has(k)) gruppen.set(k, []);
      gruppen.get(k).push(x);
    }
    const keys = Array.from(gruppen.keys()).sort().reverse().slice(0, 8);
    b.push("<div class=\"karte\"><h3>Letzte Einheiten</h3>");
    for (const k of keys) {
      const xs = gruppen.get(k);
      const teile = k.split("|");
      let ns = 0;
      for (const x of xs) ns += x.saetze.length;
      b.push("<div class=\"logzeile\"><div class=\"kopf\"><span class=\"datum\">" + kurzDatum(parseDateIso(teile[0])) + "</span>" +
        "<span>" + esc(teile[1]) + "</span>" +
        "<span class=\"zahlen\">" + xs.length + (xs.length === 1 ? " Übung" : " Übungen") + ", " + ns + " Sätze</span></div></div>");
    }
    b.push("</div>");
  }

  $("#blatt-training").innerHTML = b.join("");
}

// ----------------------------------------------------------- Aktionen

async function mitToast(arbeit, meldung) {
  try {
    await arbeit();
    renderAlles();
    if (meldung) toast(meldung);
  } catch (e) {
    if (e.keinToken) einstellungenSheet(true);
    else toast(e.message, true);
  }
}

const AKTIONEN = {
  "sheet-zu": () => sheetZu(),
  "tab": (el) => {
    aktTab = el.dataset.tab;
    document.querySelectorAll(".blatt").forEach((x) => x.classList.toggle("aktiv", x.id === "blatt-" + aktTab));
    document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.toggle("aktiv", x.dataset.tab === aktTab));
    $("#fab").classList.toggle("sichtbar", aktTab === "heute");
    window.scrollTo(0, 0);
  },
  "sync": () => aktualisieren(false),
  "einstellungen": () => einstellungenSheet(false),
  "einstellungen-speichern": async () => {
    cfg.token = $("#es-token").value.trim();
    cfg.owner = $("#es-owner").value.trim() || cfg.owner;
    cfg.repo = $("#es-repo").value.trim() || cfg.repo;
    cfg.branch = $("#es-branch").value.trim() || "main";
    cfgSpeichern();
    sheetZu();
    ablage = new Map();
    await aktualisieren(false);
  },
  "cache-leeren": () => {
    localStorage.removeItem(CACHE_KEY);
    ablage = new Map(); todoNamen = []; tagebuchNamen = []; stand = null;
    sheetZu(); renderAlles(); toast("Zwischenspeicher geleert");
  },

  "todo-menue": (el) => todoMenue(el.dataset.datei, el.dataset.raw),
  "todo-erledigt": async (el) => {
    const { datei, raw, wieder } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(
      ["Dashboard/" + datei, "Dashboard/Erledigt.md"],
      (texte) => {
        const r = todoArchivieren(texte["Dashboard/" + datei],
          texte["Dashboard/Erledigt.md"], datei, raw, wieder);
        return {
          ["Dashboard/" + datei]: wieder ? r.wiederText : r.todosText,
          "Dashboard/Erledigt.md": r.erledigtText,
        };
      },
      "Mobil: Todo erledigt" + (wieder ? ", wieder " + WIEDER[wieder][0] : "")),
    wieder ? "Erledigt, kommt " + WIEDER[wieder][0] + " wieder" : "Erledigt und archiviert");
  },
  "todo-schieben": async (el) => {
    const { datei, raw, wann } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/" + datei],
      (texte) => ({ ["Dashboard/" + datei]: todoVerschieben(texte["Dashboard/" + datei], raw, wann).text }),
      "Mobil: Todo verschoben auf " + VERSCHIEBEN[wann][0]),
    "Verschoben auf " + VERSCHIEBEN[wann][0]);
  },
  "fab": () => neuesTodoSheet(),
  "todo-anlegen": async () => {
    const datei = $("#nt-liste").value;
    let sektion = $("#nt-sektion").value;
    const neueKat = $("#nt-neuekat").value.trim();
    const todoText = $("#nt-text").value.trim();
    const due = $("#nt-due").value;
    const prio = $("#nt-prio").value;
    const auchTermin = $("#nt-termin").checked;
    if (!todoText) { toast("Todo ist leer", true); return; }
    if (sektion === "__neu__" && !neueKat) { toast("Kategoriename fehlt", true); return; }
    sheetZu();
    const pfade = ["Dashboard/" + datei];
    if (auchTermin && due) pfade.push("Dashboard/Kalender.md");
    await mitToast(() => transaktion(pfade, (texte) => {
      let t = texte["Dashboard/" + datei];
      if (sektion === "__neu__") {
        const r = sektionAnlegen(t, neueKat);
        t = r.text; sektion = r.name;
      }
      const out = { ["Dashboard/" + datei]: todoAnlegen(t, sektion, todoText, prio, due).text };
      if (auchTermin && due) {
        out["Dashboard/Kalender.md"] = kalenderAnlegen(texte["Dashboard/Kalender.md"], due, todoText, "", "").text;
      }
      return out;
    }, "Mobil: Todo angelegt"), "Todo angelegt");
  },

  "habit": async (el) => {
    const habit = el.dataset.habit;
    const an = !el.classList.contains("an");
    await mitToast(() => transaktion(["Dashboard/Habits.md"],
      (texte) => ({ "Dashboard/Habits.md": habitSetzen(texte["Dashboard/Habits.md"], habit, an, iso(heute())).text }),
      "Mobil: Habit " + habit + (an ? "" : " weg")));
  },
  "supp": async (el) => {
    const supp = el.dataset.supp;
    const an = !el.classList.contains("an");
    await mitToast(() => transaktion(["Dashboard/Gesundheit.md"],
      (texte) => ({ "Dashboard/Gesundheit.md": gesundheitSupp(texte["Dashboard/Gesundheit.md"], supp, an, iso(heute())).text }),
      "Mobil: Supplement " + supp + (an ? "" : " weg")));
  },
  "wasser": async (el) => {
    const wert = parseInt(el.dataset.wert, 10);
    await mitToast(() => transaktion(["Dashboard/Gesundheit.md"],
      (texte) => ({ "Dashboard/Gesundheit.md": gesundheitLog(texte["Dashboard/Gesundheit.md"], "wasser", wert, "add", iso(heute())).text }),
      "Mobil: Wasser"));
  },

  "training-tag-oben": async (el) => {
    if (el.dataset.oben === "1") return;
    const tag = el.dataset.tag;
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => ({ "Dashboard/Training.md": trainingTagOben(texte["Dashboard/Training.md"], tag).text }),
      "Mobil: Trainingstag " + tag + " nach oben"), tag + " ist jetzt dein aktueller Tag");
  },
  "training-tag-neu": () => trainingTagSheet(),
  "training-tag-anlegen": async () => {
    const name = $("#tr-neutag").value.trim();
    if (!name) { toast("Name fehlt", true); return; }
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => ({ "Dashboard/Training.md": trainingTagAnlegen(texte["Dashboard/Training.md"], name).text }),
      "Mobil: Trainingstag " + name), "Tag angelegt");
  },
  "training-uebung-neu": async (el) => {
    const name = $("#tr-neuueb").value.trim();
    if (!name) { toast("Name fehlt", true); return; }
    const tag = el.dataset.tag;
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => ({ "Dashboard/Training.md": trainingUebungAnlegen(texte["Dashboard/Training.md"], tag, name).text }),
      "Mobil: Uebung " + name), "Übung angelegt");
  },
  "training-uebung-weg": async (el) => {
    const { tag, uebung } = el.dataset;
    if (!confirm("Übung " + uebung + " aus dem Plan nehmen? Der Verlauf bleibt erhalten.")) return;
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => ({ "Dashboard/Training.md": trainingUebungLoeschen(texte["Dashboard/Training.md"], tag, uebung).text }),
      "Mobil: Uebung " + uebung + " raus"), "Übung ist raus, der Verlauf bleibt");
  },
  "training-satz": async (el) => {
    const { tag, uebung } = el.dataset;
    const k = el.closest(".karte");
    const gew = k.querySelector(".tr-gew").value.trim();
    const wdh = k.querySelector(".tr-wdh").value.trim();
    if (!wdh) { toast("Wiederholungen fehlen", true); return; }
    trEingaben[uebung] = { gew, wdh };
    await mitToast(() => transaktion(["Dashboard/Training.md", "Dashboard/Habits.md"],
      (texte) => {
        const r = trainingSatz(texte["Dashboard/Training.md"], tag, uebung, gew, wdh, iso(heute()));
        const h = habitSetzen(texte["Dashboard/Habits.md"], "gym", true, iso(heute()));
        return { "Dashboard/Training.md": r.text, "Dashboard/Habits.md": h.text };
      }, "Mobil: Training " + uebung), "Satz notiert");
  },
  "training-satz-weg": async (el) => {
    const { tag, uebung } = el.dataset;
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => ({ "Dashboard/Training.md": trainingSatzWeg(texte["Dashboard/Training.md"], tag, uebung, iso(heute())).text }),
      "Mobil: Training " + uebung + " Satz raus"), "Letzter Satz ist raus");
  },

  "kal-monat": (el) => { kalMonat = plusMonat(kalMonat, parseInt(el.dataset.schritt, 10)); renderKalender(); },
  "kal-tag": (el) => {
    kalTag = parseDate(el.dataset.datum);
    if (kalTag.getUTCMonth() !== kalMonat.getUTCMonth()) {
      kalMonat = makeDate(kalTag.getUTCFullYear(), kalTag.getUTCMonth() + 1, 1);
    }
    renderKalender();
  },
  "termin-neu": () => neuerTerminSheet(iso(kalTag || heute())),
  "termin-anlegen": async () => {
    const titel = $("#tm-titel").value.trim();
    const datum = $("#tm-datum").value;
    const zeit = $("#tm-zeit").value;
    const notiz = $("#tm-notiz").value.trim();
    if (!titel) { toast("Titel fehlt", true); return; }
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": kalenderAnlegen(texte["Dashboard/Kalender.md"], datum, titel, zeit, notiz).text }),
      "Mobil: Termin angelegt"), "Termin angelegt");
  },
  "termin-menue": (el) => terminMenue(el.dataset.datum, el.dataset.titel),
  "termin-loeschen": async (el) => {
    const { datum, titel } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": terminLoeschen(texte["Dashboard/Kalender.md"], datum, titel).text }),
      "Mobil: Termin geloescht"), "Termin gelöscht");
  },
  "termin-schieben": async (el) => {
    const { datum, titel, wann } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": terminVerschieben(texte["Dashboard/Kalender.md"], datum, titel, wann).text }),
      "Mobil: Termin verschoben"), "Termin verschoben auf " + VERSCHIEBEN[wann][0]);
  },

  "tb-tag": (el) => {
    if (tbDirty && !confirm("Ungespeicherte Änderungen verwerfen?")) return;
    tbDirty = false;
    tbTag = addDays(tbTag, parseInt(el.dataset.schritt, 10));
    renderTagebuch();
  },
  "tb-laden": async () => {
    await mitToast(() => ladeDatei("Tagebuch/" + punktDatum(tbTag) + ".md"));
  },
  "tb-vorlage": () => {
    const ta = $("#tbedit");
    if (ta && !ta.value.trim()) { ta.value = tagebuchVorlage(tbTag); tbDirty = true; }
  },
  "tb-voll-speichern": async () => {
    const eingabe = $("#tbedit").value;
    if (!eingabe.trim()) { toast("Eintrag ist leer, so speichere ich nicht", true); return; }
    const tag = tbTag;
    const pfad = "Tagebuch/" + punktDatum(tag) + ".md";
    await mitToast(async () => {
      const vorhanden = await alleNotizNamen();
      const worte = parseSchlagworte(text("Dashboard/Schlagworte.md"));
      const stubs = [];
      await transaktion([pfad], () => {
        const kopie = new Map(vorhanden);
        const r = tagebuchSpeichern(eingabe, kopie, worte);
        stubs.length = 0;
        stubs.push.apply(stubs, r.angelegt);
        return { [pfad]: r.content };
      }, "Mobil: Tagebuch " + iso(tag));
      for (const name of stubs) {
        try { await putDatei(name + ".md", "", "Mobil: Notiz " + name + " angelegt"); }
        catch (e) { /* Stub gibt es wohl schon, egal */ }
      }
      if (!tagebuchNamen.includes(punktDatum(tag) + ".md")) {
        tagebuchNamen.push(punktDatum(tag) + ".md");
        tagebuchNamen.sort();
      }
      cacheSpeichern();
      tbDirty = false;
      return stubs;
    }, "Gespeichert");
  },

  "sozial-log": async () => {
    const kuerzel = $("#sozial-kuerzel").value;
    const vorher = $("#sozial-vorher").value;
    const nachher = $("#sozial-nachher").value;
    const notiz = $("#sozial-notiz").value;
    await mitToast(() => transaktion(["Dashboard/Sozial.md", "Dashboard/Habits.md"],
      (texte) => {
        const daten = parseSozial(texte["Dashboard/Sozial.md"]);
        const bekannt = new Set(daten.stufen.map((x) => x.kuerzel));
        bekannt.add("frei");
        const r = sozialLog(texte["Dashboard/Sozial.md"], kuerzel, vorher, nachher, notiz, iso(heute()), bekannt);
        const h = habitSetzen(texte["Dashboard/Habits.md"], "sozial", true, iso(heute()));
        return { "Dashboard/Sozial.md": r.text, "Dashboard/Habits.md": h.text };
      }, "Mobil: Soziale Uebung " + kuerzel), "Eingetragen. Beweis gesammelt.");
  },
  "sozial-stufe": async (el) => {
    const stufe = parseInt(el.dataset.stufe, 10);
    await mitToast(() => transaktion(["Dashboard/Sozial.md"],
      (texte) => {
        const daten = parseSozial(texte["Dashboard/Sozial.md"]);
        return { "Dashboard/Sozial.md": sozialStufeSetzen(texte["Dashboard/Sozial.md"], stufe, daten.stufen.map((x) => x.stufe)).text };
      }, "Mobil: Sozial-Stufe " + stufe), "Stufe " + stufe + " gesetzt");
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-aktion]");
  if (!el) return;
  if (el.tagName === "A") return;
  const fn = AKTIONEN[el.dataset.aktion];
  if (fn) { ev.preventDefault(); fn(el); }
});
$("#schleier").addEventListener("click", (ev) => {
  if (ev.target === $("#schleier")) sheetZu();
});

// ------------------------------------------------------------- Start

(function start() {
  const hatCache = cacheLaden();
  renderAlles();
  AKTIONEN.tab({ dataset: { tab: "heute" } });
  if (!cfg.token) einstellungenSheet(true);
  else aktualisieren(hatCache);
})();
// ===APP-END===

</script>
</body>
</html>
