const DIENSTE = [
  ["tiktok.", "TikTok"],
  ["instagram.", "Instagram"],
  ["youtube.", "YouTube"],
  ["youtu.be", "YouTube"],
  ["facebook.", "Facebook"],
  ["pinterest.", "Pinterest"],
];

const KOCH_PREFIX = "Kochen: ";
const REZEPT_ORDNER = "Rezepte";
const REZEPT_ARCHIV = "_Archiv";
const REZEPT_QUEUE_PFAD = "Dashboard/Rezepte - Warteschlange.md";

// Python: str.strip() ohne Argument, plus strip(zeichen) fuer Punkte.
function stripPunkte(s) { return s.replace(/^\.+/, "").replace(/\.+$/, ""); }

function katKey(roh) {
  const t = String(roh == null ? "" : roh).trim().replace(/^#+/, "").toLowerCase();
  if (Object.prototype.hasOwnProperty.call(KAT_LABEL, t)) return t;
  return Object.prototype.hasOwnProperty.call(KAT_ALIAS, t) ? KAT_ALIAS[t] : null;
}

function katKeys(roh) {
  const kandidaten = Array.isArray(roh)
    ? roh.slice()
    : String(roh == null ? "" : roh).split(/[\s,]+/);
  const out = [];
  for (const t of kandidaten) {
    const k = katKey(t);
    if (k && !out.includes(k)) out.push(k);
  }
  out.sort((a, b) => KAT_KEYS.indexOf(a) - KAT_KEYS.indexOf(b));
  return out;
}

function dienstName(url) {
  const klein = String(url || "").toLowerCase();
  for (const d of DIENSTE) if (klein.includes(d[0])) return d[1];
  return "Web";
}

function listenzeile(z) {
  return String(z == null ? "" : z).replace(LISTENZEILE_RE, "").trim();
}

// Textfeld oder Liste zu sauberen Eintraegen, leere Zeilen fliegen raus.
function eintragszeilen(roh) {
  const kandidaten = Array.isArray(roh) ? roh.slice() : nl(roh).split("\n");
  const out = [];
  for (const z of kandidaten) {
    const s = listenzeile(String(z).trim());
    if (s) out.push(s);
  }
  return out;
}

function rohTags(roh) {
  const kandidaten = Array.isArray(roh)
    ? roh.slice()
    : String(roh == null ? "" : roh).split(/[\s,]+/);
  const out = [];
  for (let t of kandidaten) {
    t = String(t).trim().replace(/^#+/, "").toLowerCase();
    if (t && t !== "rezept" && !out.includes(t) && TAG_ERLAUBT_RE.test(t)) out.push(t);
  }
  return out;
}

// Die Tagzeile einer Rezept-Notiz: erst rezept, dann die Kategorien in
// fester Reihenfolge, dann alles Freie.
function rezeptTags(tags, kategorien) {
  const keys = katKeys(katKeys(kategorien).concat(katKeys(tags)));
  const out = ["rezept"].concat(keys);
  for (const t of rohTags(tags)) {
    if (!out.includes(t) && !katKey(t)) out.push(t);
  }
  return out;
}

// Liest eine Rezept-Notiz. Fehlt ein Abschnitt, bleibt er einfach leer.
function rezeptParsen(text, fallback) {
  let titel = "";
  const tags = [];
  const meta = {};
  const zutaten = [];
  const schritte = [];
  let wo = "kopf";
  for (const roh of nl(text).split("\n")) {
    const z = roh.trim();
    if (z.startsWith("## ")) {
      const name = z.slice(3).trim().toLowerCase();
      if (name.startsWith("zutat")) wo = "zutaten";
      else if (name.startsWith("zubereitung") || name.startsWith("schritte")
        || name.startsWith("anleitung") || name.startsWith("zubereiten")) wo = "zubereitung";
      else wo = "rest";
      continue;
    }
    if (z.startsWith("# ")) {
      if (!titel) titel = z.slice(2).trim();
      continue;
    }
    if (!z || z.startsWith("<!--") || z.startsWith("---") || z.startsWith("-->")) continue;
    if (wo === "kopf") {
      const m = z.match(REZEPT_META_RE);
      if (m) { meta[m[1].toLowerCase()] = m[2].trim(); continue; }
      if (TAGZEILE_RE.test(z)) {
        for (const t of z.matchAll(TAG_IN_ZEILE_RE)) {
          if (!tags.includes(t[1].toLowerCase())) tags.push(t[1].toLowerCase());
        }
        continue;
      }
    } else if (wo === "zutaten") {
      zutaten.push(listenzeile(z));
    } else if (wo === "zubereitung") {
      schritte.push(listenzeile(z));
    }
  }
  const kategorien = katKeys(tags);
  const frei = tags.filter((t) => t !== "rezept" && !katKey(t));
  return {
    titel: titel || fallback,
    kategorien, tags: frei,
    portionen: meta["portionen"] || "",
    dauer: meta["dauer"] || "",
    naehrwerte: meta["nährwerte"] || "",
    quelle: meta["quelle"] || "",
    angelegt: meta["angelegt"] || "",
    zutaten, zubereitung: schritte,
  };
}

// Themenname zu einem unter Windows erlaubten Dateinamen.
function dateiname(name) {
  let sauber = "";
  for (const c of String(name == null ? "" : name)) {
    sauber += VERBOTEN_IM_DATEINAMEN.includes(c) ? " " : c;
  }
  sauber = stripPunkte(sauber.replace(/\s{2,}/g, " ").trim());
  return sauber.slice(0, 110) || "Thema";
}

// Baut den Markdown-Text einer Rezept-Notiz.
function rezeptText(titel, zutaten, zubereitung, tags, portionen, dauer,
  quelle, tag, kategorien, naehrwerte) {
  tag = tag || heute();
  const teile = ["# " + titel, ""];
  teile.push(rezeptTags(tags, kategorien).map((t) => "#" + t).join(" "));
  teile.push("");
  const meta = [["Portionen", portionen], ["Dauer", dauer],
    ["Nährwerte", naehrwerte], ["Quelle", quelle]];
  for (const mw of meta) {
    if (String(mw[1] == null ? "" : mw[1]).trim()) {
      teile.push(mw[0] + ": " + String(mw[1]).trim());
    }
  }
  teile.push("Angelegt: " + iso(tag));
  teile.push("", "## Zutaten", "");
  for (const z of eintragszeilen(zutaten)) teile.push("- " + z);
  const schritte = eintragszeilen(zubereitung);
  if (schritte.length) {
    teile.push("", "## Zubereitung", "");
    for (let i = 0; i < schritte.length; i++) teile.push((i + 1) + ". " + schritte[i]);
  }
  return rstripNl(teile.join("\n")) + "\n";
}

// Prueft die Eingaben wie rezept_anlegen am PC und gibt {datei, text}
// zurueck. Das Schreiben selbst macht die Oberflaeche per Transaktion.
function rezeptNeu(felder, tag) {
  const titel = String(felder.titel || "").split(/\s+/).filter(Boolean).join(" ");
  if (!titel) throw new Error("Kein Titel");
  if (titel.length > 120) throw new Error("Titel zu lang");
  if (!eintragszeilen(felder.zutaten).length) throw new Error("Ohne Zutaten ist es kein Rezept");
  const quelle = String(felder.quelle || "").trim();
  if (quelle && !URL_RE.test(quelle)) throw new Error("Die Quelle ist keine Adresse");
  return {
    titel,
    datei: dateiname(titel) + ".md",
    text: rezeptText(titel, felder.zutaten, felder.zubereitung, felder.tags,
      felder.portionen, felder.dauer, quelle, tag || heute(),
      felder.kategorien, felder.naehrwerte),
  };
}

// Schreibt eine bestehende Notiz komplett neu. Das Anlegedatum bleibt
// stehen. Gibt {titel, datei, text, altTitel} zurueck.
function rezeptBearbeiten(altText, altDatei, felder) {
  const alt = rezeptParsen(altText, altDatei.replace(/\.md$/, ""));
  const titel = String(felder.titel || "").split(/\s+/).filter(Boolean).join(" ") || alt.titel;
  if (titel.length > 120) throw new Error("Titel zu lang");
  if (!eintragszeilen(felder.zutaten).length) throw new Error("Ohne Zutaten ist es kein Rezept");
  const quelle = String(felder.quelle || "").trim();
  if (quelle && !URL_RE.test(quelle)) throw new Error("Die Quelle ist keine Adresse");
  const tag = parseDateIso(alt.angelegt) || heute();
  return {
    titel, altTitel: alt.titel,
    datei: dateiname(titel) + ".md",
    text: rezeptText(titel, felder.zutaten, felder.zubereitung, felder.tags,
      felder.portionen, felder.dauer, quelle, tag, felder.kategorien,
      felder.naehrwerte),
  };
}

// Nackte Zahl bekommt das Wort dazu, alles andere bleibt wie es ist.
function portionenLabel(wert) {
  const w = String(wert == null ? "" : wert).trim();
  if (!/^\d+$/.test(w)) return w;
  return w === "1" ? "1 Portion" : w + " Portionen";
}

// ------------------------------------------------------- Kochtermine

// Die eingeplanten Rezepte, nach Datum. Ohne alle nur ab heute.
function parseKochplan(kalText, alle) {
  const grenze = alle ? null : heute();
  const out = [];
  for (const t of parseKalender(kalText)) {
    if (!t.titel.startsWith(KOCH_PREFIX)) continue;
    if (grenze && t.datum < grenze) continue;
    out.push({ datum: t.datum, zeit: t.zeit, titel: t.titel.slice(KOCH_PREFIX.length).trim() });
  }
  out.sort((a, b) => (a.datum - b.datum)
    || ((a.zeit || "99:99") < (b.zeit || "99:99") ? -1 : (a.zeit || "99:99") > (b.zeit || "99:99") ? 1 : 0));
  return out;
}

function rezeptEinplanen(kalText, titel, datum, zeit) {
  titel = String(titel || "").split(/\s+/).filter(Boolean).join(" ");
  return kalenderAnlegen(kalText, datum, KOCH_PREFIX + titel, zeit || "", "");
}

function rezeptAusplanen(kalText, titel, datum) {
  titel = String(titel || "").split(/\s+/).filter(Boolean).join(" ");
  return terminLoeschen(kalText, datum, KOCH_PREFIX + titel);
}

// Nach einer Titelaenderung zeigen die Termine sonst ins Leere.
function kochtermineUmbenennen(kalText, alt, neu) {
  let text = kalText;
  for (const t of parseKalender(kalText)) {
    if (t.titel !== KOCH_PREFIX + alt) continue;
    text = terminLoeschen(text, iso(t.datum), t.titel).text;
    text = kalenderAnlegen(text, iso(t.datum), KOCH_PREFIX + neu, t.zeit, t.notiz).text;
  }
  return text;
}

// ---------------------------------------------------- Warteschlange

// Der Teil hinter der Adresse zu {kategorien, notiz}.
function queueRest(rest) {
  const teile = String(rest == null ? "" : rest).split("|").map((t) => t.trim());
  if (teile.length >= 2) {
    return { kategorien: katKeys(teile[0]),
      notiz: teile.slice(1).filter(Boolean).join(" ").trim() };
  }
  const einziges = teile.length ? teile[0] : "";
  if (einziges && TAGZEILE_RE.test(einziges)) {
    return { kategorien: katKeys(einziges), notiz: "" };
  }
  return { kategorien: [], notiz: einziges };
}

function parseRezeptQueue(text) {
  const out = { offen: [], fertig: [] };
  let wo = null;
  for (const roh of nl(text).split("\n")) {
    const z = roh.trim();
    if (z.startsWith("## ")) {
      const name = z.slice(3).trim().toLowerCase();
      wo = name.startsWith("offen") ? "offen" : name.startsWith("fertig") ? "fertig" : null;
      continue;
    }
    if (wo === null || !z) continue;
    const m = z.match(QUEUE_RE);
    if (m) {
      const r = queueRest(m[3]);
      out[wo].push({ wann: m[1].replace("T", " "), url: m[2],
        kategorien: r.kategorien, notiz: r.notiz, dienst: dienstName(m[2]) });
    }
  }
  return out;
}

function queueZeilen(text) {
  const zeilen = zeilenAus(text);
  return zeilen.filter((z) => z.trim()).length ? zeilen : QUEUE_GRUNDGERUEST.slice();
}

// {index, wo} der Zeile mit dieser Adresse, sonst {index: null, wo: null}.
function queueEintragSuchen(zeilen, url) {
  let wo = null;
  for (let i = 0; i < zeilen.length; i++) {
    const z = zeilen[i].trim();
    if (z.startsWith("## ")) {
      const name = z.slice(3).trim().toLowerCase();
      wo = name.startsWith("offen") ? "offen" : name.startsWith("fertig") ? "fertig" : null;
      continue;
    }
    const m = z.match(QUEUE_RE);
    if (m && m[2] === url) return { index: i, wo };
  }
  return { index: null, wo: null };
}

function queueZeile(stempel, url, kategorien, notiz) {
  const teile = ["- " + stempel + " | " + url];
  const keys = katKeys(kategorien);
  if (keys.length || notiz) teile.push(keys.map((k) => "#" + k).join(" "));
  if (notiz) teile.push(notiz);
  return teile.join(" | ");
}

// Haengt eine Zeile unten an die Sektion, ohne die Leerzeile davor
// kaputt zu machen. Wie _zeile_ans_ende am PC.
function zeileAnsEnde(zeilen, sektion, neu) {
  const i = sektionSichern(zeilen, sektion);
  const ende = sektionEnde(zeilen, i);
  let einfuegen = ende;
  while (einfuegen > i + 1 && !zeilen[einfuegen - 1].trim()) einfuegen -= 1;
  if (einfuegen === i + 1) { zeilen.splice(einfuegen, 0, ""); einfuegen += 1; }
  zeilen.splice(einfuegen, 0, neu);
  return zeilen;
}

// Neuer Link in die Warteschlange, unter ## Offen. stempel im Format
// JJJJ-MM-TT HH:MM, den liefert die Oberflaeche aus der lokalen Uhr.
function rezeptQueueAnlegen(text, url, notiz, stempel, kategorien) {
  url = String(url || "").trim();
  if (!URL_RE.test(url)) throw new Error("Das ist keine Adresse");
  if (url.length > 500) throw new Error("Adresse zu lang");
  notiz = String(notiz == null ? "" : notiz).split(/\s+/).filter(Boolean).join(" ")
    .replace(/\|/g, "/").slice(0, 900);
  const zeilen = queueZeilen(text);
  const fund = queueEintragSuchen(zeilen, url);
  if (fund.wo === "offen") throw new Error("Steht schon in der Warteschlange");
  const zeile = queueZeile(stempel, url, kategorien, notiz);
  zeileAnsEnde(zeilen, "Offen", zeile);
  return { text: joinZeilen(zeilen), zeile };
}

// Nimmt einen Link wieder raus, ohne dass ein Rezept daraus wurde.
function rezeptQueueWeg(text, url) {
  url = String(url || "").trim();
  const zeilen = queueZeilen(text);
  const fund = queueEintragSuchen(zeilen, url);
  if (fund.index === null) throw new Error("Nicht in der Warteschlange: " + url);
  const weg = zeilen[fund.index].trim();
  zeilen.splice(fund.index, 1);
  return { text: joinZeilen(zeilen), weg };
}

<script>
// ===APP-START===
// Dashboard Mobile: Oberflaeche und GitHub-Anbindung.
// Der Kern (Parser und Schreiblogik) steht in core.js und ist 1:1 aus
// generate.py und aktionen.py portiert.
"use strict";

// ------------------------------------------------------------- Helfer

const $ = (sel) => document.querySelector(sel);
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function verlinke(s) {
  // Nur fuers Anzeigen: nackte Adressen anklickbar machen.
  return esc(s).replace(/(https?:\/\/[^\s<>"']+)/g,
    (u) => '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>");
}
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
  "August", "September", "Oktober", "November", "Dezember"];
function kurzDatum(d) {
  const p = (x) => String(x).padStart(2, "0");
  return WOCHENTAGE[weekday(d)] + " " + p(d.getUTCDate()) + "." + p(d.getUTCMonth() + 1) + ".";
}
function langDatum(d) {
  return WOCHENTAGE[weekday(d)] + ", " + d.getUTCDate() + ". " + MONATE[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

let toastTimer = null;
function toast(text, fehler) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "sichtbar" + (fehler ? " rot" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, fehler ? 5000 : 2600);
}

function sheetOeffnen(html) {
  $("#sheetinhalt").innerHTML = html;
  $("#schleier").classList.add("offen");
}
function sheetZu() {
  $("#schleier").classList.remove("offen");
  $("#sheetinhalt").innerHTML = "";
}

// ------------------------------------------------- Einstellungen, Ablage

const VERSION = 12;

const CFG_KEY = "dashmobil-cfg";
const CACHE_KEY = "dashmobil-cache";

let cfg = { owner: "ReapreZ", repo: "obsidian-vault", branch: "main", token: "" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); } catch (e) { /* egal */ }
function cfgSpeichern() { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

// ablage: pfad -> {text, sha}
let ablage = new Map();
let todoNamen = [];       // Dateinamen Dashboard/Todos*.md in fester Reihenfolge
let tagebuchNamen = [];   // JJJJ.MM.TT.md, aufsteigend
let rezNamen = [];        // Dateinamen in Rezepte/, ohne _Archiv
let stand = null;         // Zeitpunkt des letzten erfolgreichen Ladens

function cacheSpeichern() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      ablage: Array.from(ablage.entries()), todoNamen, tagebuchNamen,
      rezNamen, stand,
    }));
  } catch (e) { /* Speicher voll, egal */ }
}
function cacheLaden() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!c) return false;
    ablage = new Map(c.ablage);
    todoNamen = c.todoNamen || [];
    tagebuchNamen = c.tagebuchNamen || [];
    rezNamen = c.rezNamen || [];
    stand = c.stand || null;
    return ablage.size > 0;
  } catch (e) { return false; }
}

// --------------------------------------------------------- GitHub-API

const API = "https://api.github.com";

function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function b64enc(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function apiPfad(pfad) {
  return pfad.split("/").map(encodeURIComponent).join("/");
}

async function api(weg, opts) {
  if (!cfg.token) { const e = new Error("Kein Token hinterlegt"); e.keinToken = true; throw e; }
  // cache no-store: GitHub schickt private Antworten mit max-age 60, sonst
  // zeigt ein Aktualisieren direkt nach dem Schreiben wieder den alten Stand.
  const r = await fetch(API + "/repos/" + cfg.owner + "/" + cfg.repo + weg, Object.assign({
    cache: "no-store",
    headers: {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    },
  }, opts || {}));
  if (r.status === 404) { const e = new Error("404"); e.fehlt = true; throw e; }
  if (r.status === 401) { const e = new Error("Token ungültig oder abgelaufen"); e.keinToken = true; throw e; }
  if (r.status === 409 || r.status === 422) {
    const e = new Error("Konflikt"); e.konflikt = true; throw e;
  }
  if (!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}

async function ladeDatei(pfad) {
  try {
    const d = await api("/contents/" + apiPfad(pfad) + "?ref=" + cfg.branch);
    const eintrag = { text: b64dec(d.content), sha: d.sha };
    ablage.set(pfad, eintrag);
    return eintrag;
  } catch (e) {
    if (e.fehlt) { const leer = { text: "", sha: null }; ablage.set(pfad, leer); return leer; }
    throw e;
  }
}

async function holeDatei(pfad) {
  return ablage.get(pfad) || ladeDatei(pfad);
}

async function ladeOrdner(pfad) {
  return api("/contents/" + apiPfad(pfad) + "?ref=" + cfg.branch);
}

async function putDatei(pfad, text, nachricht) {
  const alt = ablage.get(pfad);
  const body = { message: nachricht, content: b64enc(text), branch: cfg.branch };
  if (alt && alt.sha) body.sha = alt.sha;
  const d = await api("/contents/" + apiPfad(pfad), {
    method: "PUT", body: JSON.stringify(body),
  });
  ablage.set(pfad, { text, sha: d.content.sha });
}

// Loescht eine Datei im Repo. Braucht den sha, wie das Schreiben auch.
async function loeschDatei(pfad, nachricht) {
  const alt = ablage.get(pfad);
  const sha = alt && alt.sha ? alt.sha : (await ladeDatei(pfad)).sha;
  if (!sha) return;
  await api("/contents/" + apiPfad(pfad), {
    method: "DELETE",
    body: JSON.stringify({ message: nachricht, sha, branch: cfg.branch }),
  });
  ablage.delete(pfad);
}

// Fuehrt rechne(texte) aus und schreibt alle geaenderten Dateien.
// Bei einem sha-Konflikt wird frisch geladen und neu gerechnet.
async function transaktion(pfade, rechne, nachricht) {
  for (let versuch = 0; versuch < 3; versuch++) {
    const texte = {};
    for (const p of pfade) texte[p] = (await holeDatei(p)).text;
    const out = rechne(texte);
    try {
      for (const p of Object.keys(out)) {
        if (out[p] !== null && out[p] !== nl(texte[p])) {
          await putDatei(p, out[p], nachricht);
        }
      }
      cacheSpeichern();
      return;
    } catch (e) {
      if (e.konflikt) { for (const p of pfade) ablage.delete(p); continue; }
      throw e;
    }
  }
  throw new Error("Dauerkonflikt, bitte einmal neu laden");
}

async function alleNotizNamen() {
  const d = await api("/git/trees/" + encodeURIComponent(cfg.branch) + "?recursive=1");
  const map = new Map();
  for (const e of d.tree || []) {
    if (e.type !== "blob" || !e.path.endsWith(".md")) continue;
    if (/(^|\/)(\.obsidian|\.git|\.trash)\//.test(e.path)) continue;
    const name = e.path.split("/").pop().slice(0, -3);
    if (!map.has(name.toLowerCase())) map.set(name.toLowerCase(), name);
  }
  return map;
}

// ------------------------------------------------------------- Laden

let laedt = false;

async function aktualisieren(leise) {
  if (laedt) return;
  if (!cfg.token) { einstellungenSheet(true); return; }
  laedt = true;
  $("#syncknopf").classList.add("dreht");
  try {
    const dash = await ladeOrdner("Dashboard");
    const namen = dash.filter((e) => e.type === "file" && /^Todos.*\.md$/.test(e.name))
      .map((e) => e.name).sort();
    if (namen.includes("Todos.md")) {
      namen.splice(namen.indexOf("Todos.md"), 1);
      namen.unshift("Todos.md");
    }
    todoNamen = namen;

    const feste = ["Dashboard/Kalender.md", "Dashboard/Habits.md",
      "Dashboard/Schichten.md", "Dashboard/Gesundheit.md",
      "Dashboard/Sozial.md", "Dashboard/Training.md",
      "Dashboard/Schlagworte.md", REZEPT_QUEUE_PFAD];
    for (const k of MEDIEN_KAT) feste.push("Medien/" + k[2], "Medien/" + k[3]);
    await Promise.all(
      namen.map((n) => ladeDatei("Dashboard/" + n)).concat(feste.map(ladeDatei)));

    // Rezepte sind einzelne Notizen. Der Unterordner _Archiv taucht als
    // type dir auf und faellt damit von selbst raus, wie am PC.
    const rz = await ladeOrdner("Rezepte").catch(() => []);
    rezNamen = rz.filter((e) => e.type === "file" && /\.md$/i.test(e.name))
      .map((e) => e.name).sort();
    await Promise.all(rezNamen.map((n) => ladeDatei("Rezepte/" + n)));

    const tb = await ladeOrdner("Tagebuch").catch(() => []);
    tagebuchNamen = tb.filter((e) => e.type === "file" && /^\d{4}\.\d{2}\.\d{2}\.md$/.test(e.name))
      .map((e) => e.name).sort();
    // Heutigen Eintrag plus die letzten Eintraege laden. Fuer die Ziele
    // rueckwaerts in Paketen nachladen, bis welche gefunden sind, wie
    // letzte_ziele am PC (das liest einfach alle).
    const laden = new Set(tagebuchNamen.slice(-7));
    laden.add(punktDatum(heute()) + ".md");
    await Promise.all(Array.from(laden)
      .filter((n) => tagebuchNamen.includes(n))
      .map((n) => ladeDatei("Tagebuch/" + n)));
    let tiefe = 7;
    while (!letzteZiele(tagebuchEintraege()) && tiefe < tagebuchNamen.length && tiefe < 60) {
      const paket = tagebuchNamen.slice(-(tiefe + 8), -tiefe);
      if (!paket.length) break;
      await Promise.all(paket.map((n) => ladeDatei("Tagebuch/" + n)));
      tiefe += 8;
    }

    stand = Date.now();
    cacheSpeichern();
    renderAlles();
    if (!leise) toast("Aktualisiert");
  } catch (e) {
    if (e.keinToken) { einstellungenSheet(true); }
    else toast("Laden fehlgeschlagen: " + e.message + (stand ? ". Zeige letzten Stand." : ""), true);
  } finally {
    laedt = false;
    $("#syncknopf").classList.remove("dreht");
  }
}

// ------------------------------------------------------ Abgeleitetes

function text(pfad) { return (ablage.get(pfad) || { text: "" }).text; }

function todoDateien() {
  return todoNamen.map((datei) => ({ datei, text: text("Dashboard/" + datei) }));
}
function alleTodos() { return parseTodos(todoDateien()); }
function tagebuchEintraege() {
  const raus = [];
  for (const n of tagebuchNamen) {
    if (!ablage.has("Tagebuch/" + n)) continue;
    const d = parseDate(n.slice(0, -3));
    if (d) raus.push({ datum: d, text: text("Tagebuch/" + n) });
  }
  raus.sort((a, b) => a.datum - b.datum);
  return raus;
}

// ------------------------------------------------------------ Render

let aktTab = "heute";
let kalMonat = null;   // erster Tag des angezeigten Monats
let kalTag = null;     // ausgewaehlter Tag
let tbTag = null;      // Tagebuch-Datum

function renderAlles() {

  $("#standzeile").textContent = (stand
    ? "Stand " + new Date(stand).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    : "Noch nichts geladen") + " · Version " + VERSION;

}

// ------------------------------------------------------------- Heute

function todoZeileHtml(t, mitFaellig) {
  const idx = "data-datei=\"" + esc(t.datei) + "\" data-raw=\"" + esc(t.raw) + "\"";
  let meta = "<span>" + esc(t.liste) + " / " + esc(t.sektion) + "</span>";
  if (t.prio) meta += "<span class=\"prio " + t.prio + "\">" + PRIO_LABEL[t.prio] + "</span>";
  if (t.due && mitFaellig) {
    const n = tageDiff(t.due, heute());
    const cls = n < 0 ? "ueberfaellig" : n === 0 ? "heutefaellig" : "";
    meta += "<span class=\"" + cls + "\">" + esc(faelligText(t.due)) + "</span>";
  } else if (t.due) {
    meta += "<span>@" + iso(t.due) + "</span>";
  }
  return "<div class=\"todo\">" +
    "<button class=\"kreis\" data-aktion=\"todo-menue\" " + idx + " aria-label=\"abhaken\"></button>" +
    "<div class=\"inhalt\" data-aktion=\"todo-menue\" " + idx + ">" +
    "<div class=\"text\">" + verlinke(t.text) + "</div>" +
    "<div class=\"meta\">" + meta + "</div></div></div>";
}

function renderHeute() {
  const b = [];
  const h = heute();
  const cfgS = parseSchichten(text("Dashboard/Schichten.md"));
  const heuteS = schichtAm(h, cfgS);
  const morgenS = schichtAm(addDays(h, 1), cfgS);

  b.push("<div class=\"karte\"><h3>Schicht</h3><div class=\"schichtzeile\">");
  if (heuteS) {
    b.push("<span class=\"name\">" + esc(heuteS.name) + "</span>" +
      "<span class=\"zeit\">" + esc(heuteS.von) + " bis " + esc(heuteS.bis) + "</span>");
  } else {
    b.push("<span class=\"name\">Frei</span>");
  }
  b.push("<span class=\"morgen\">morgen<br>" + esc(morgenS ? morgenS.name : "frei") + "</span>");
  b.push("</div></div>");

  const todos = alleTodos().filter((t) => !t.done);
  const faellig = todos.filter((t) => t.due && tageDiff(t.due, h) <= 0);
  faellig.sort((x, y) => (x.due - y.due) || (PRIO_RANK[x.prio] - PRIO_RANK[y.prio]));
  b.push("<div class=\"karte\"><h3>Fällig <span class=\"zusatz\">" + faellig.length + " offen</span></h3>");
  if (faellig.length) b.push(faellig.map((t) => todoZeileHtml(t, true)).join(""));
  else b.push("<div class=\"leer\">Nichts fällig. Prag wartet.</div>");
  b.push("</div>");

  // Habits
  const habits = parseHabits(text("Dashboard/Habits.md"));
  const heuteHabits = habits[iso(h)] || [];
  const bekannt = Object.keys(HABIT_LABEL);
  const extra = heuteHabits.filter((x) => !bekannt.includes(x));
  b.push("<div class=\"karte\"><h3>Habits <span class=\"zusatz\">" + heuteHabits.length + " heute</span></h3><div class=\"chips\">");
  for (const k of bekannt.concat(extra)) {
    const an = heuteHabits.includes(k);
    const s = streak(habits, k);
    b.push("<button class=\"chip" + (an ? " an" : "") + "\" data-aktion=\"habit\" data-habit=\"" + esc(k) + "\">" +
      esc(HABIT_LABEL[k] || k) + (s > 1 ? "<span class=\"strk\">" + s + "×</span>" : "") + "</button>");
  }
  b.push("</div></div>");

  // Supplemente und Wasser
  const ges = parseGesundheit(text("Dashboard/Gesundheit.md"));
  const logHeute = ges.log[iso(h)] || {};
  const suppHeute = logHeute.supp || [];
  const dran = ges.supplemente.filter((s) => suppFaellig(s, h));
  const rest = ges.supplemente.filter((s) => !suppFaellig(s, h));
  const offen = dran.filter((s) => !suppHeute.includes(s.key)).length;
  b.push("<div class=\"karte\"><h3>Supplemente <span class=\"zusatz\">" +
    (offen ? offen + " offen" : "alle genommen") + "</span></h3><div class=\"chips\">");
  for (const s of dran) {
    b.push("<button class=\"chip" + (suppHeute.includes(s.key) ? " an" : "") + "\" data-aktion=\"supp\" data-supp=\"" + esc(s.key) + "\">" + esc(s.label) + "</button>");
  }
  b.push("</div>");
  if (rest.length) {
    b.push("<div class=\"leisezeile\">Heute nicht dran:<div class=\"chips\">");
    for (const s of rest) {
      b.push("<button class=\"chip leise" + (suppHeute.includes(s.key) ? " an" : "") + "\" data-aktion=\"supp\" data-supp=\"" + esc(s.key) + "\">" +
        esc(s.label) + " · " + esc(suppWann(s)) + "</button>");
    }
    b.push("</div></div>");
  }
  const wasser = parseFloat(logHeute.wasser || 0) || 0;
  const ziel = ges.ziele.wasser || 8;
  let glaeser = "";
  for (let i = 0; i < Math.max(ziel, wasser); i++) glaeser += i < wasser ? "●" : "○";
  b.push("<div class=\"wasser\"><button data-aktion=\"wasser\" data-wert=\"-1\">−</button>" +
    "<span class=\"stand\">Wasser " + wasser + " von " + ziel + "</span>" +
    "<span class=\"glaeser\">" + glaeser + "</span>" +
    "<button class=\"plus\" data-aktion=\"wasser\" data-wert=\"1\">+</button></div>");
  b.push("</div>");

  // Naechste Termine
  const termine = parseKalender(text("Dashboard/Kalender.md"))
    .filter((t) => t.datum >= h).slice(0, 5);
  b.push("<div class=\"karte\"><h3>Nächste Termine</h3>");
  if (termine.length) {
    for (const t of termine) {
      b.push("<div class=\"termin\" data-aktion=\"termin-menue\" data-datum=\"" + iso(t.datum) + "\" data-titel=\"" + esc(t.titel) + "\">" +
        "<span class=\"wann\">" + kurzDatum(t.datum) + "</span>" +
        "<span class=\"titel\">" + verlinke(t.titel) +
        (t.zeit ? " <span class=\"zeit\">" + esc(t.zeit) + "</span>" : "") + "</span></div>");
    }
  } else b.push("<div class=\"leer\">Keine Termine.</div>");
  b.push("</div>");

  // Ziele fuer morgen
  const lz = letzteZiele(tagebuchEintraege());
  if (lz) {
    b.push("<div class=\"karte\"><h3>Ziele aus dem Tagebuch <span class=\"zusatz\">vom " + kurzDatum(lz.datum) + "</span></h3>");
    for (const z of lz.ziele) b.push("<div class=\"todo\"><div class=\"inhalt\"><div class=\"text\">" + verlinke(z.replace(/^[-*]\s*/, "")) + "</div></div></div>");
    b.push("</div>");
  }

  // Alle Todos nach Liste
  const listen = todoListen(todoDateien());
  b.push("<div class=\"karte\"><h3>Alle Todos</h3>");
  const alle = alleTodos().filter((t) => !t.done);
  for (const l of listen) {
    const eigene = alle.filter((t) => t.datei === l.datei);
    b.push("<details class=\"liste-details\"><summary><span class=\"pfeil\">▶</span>" + esc(l.liste) +
      "<span class=\"anzahl\">" + eigene.length + "</span></summary>");
    for (const sek of l.sektionen) {
      const st = eigene.filter((t) => t.sektion === sek);
      if (!st.length) continue;
      b.push("<div class=\"sektionstitel\">" + esc(sek) + "</div>");
      b.push(st.map((t) => todoZeileHtml(t, false)).join(""));
    }
    b.push("</details>");
  }
  b.push("</div>");

  $("#blatt-heute").innerHTML = b.join("");
}

// ----------------------------------------------------------- Kalender

function renderKalender() {
  const h = heute();
  if (!kalMonat) kalMonat = makeDate(h.getUTCFullYear(), h.getUTCMonth() + 1, 1);
  if (!kalTag) kalTag = h;
  const cfgS = parseSchichten(text("Dashboard/Schichten.md"));
  const termine = parseKalender(text("Dashboard/Kalender.md"));
  const todos = alleTodos().filter((t) => !t.done && t.due);

  const proTag = {};
  for (const t of termine) (proTag[iso(t.datum)] = proTag[iso(t.datum)] || []).push(t);
  const todosTag = {};
  for (const t of todos) (todosTag[iso(t.due)] = todosTag[iso(t.due)] || []).push(t);

  const b = [];
  b.push("<div class=\"kalkopf\"><button data-aktion=\"kal-monat\" data-schritt=\"-1\">‹</button>" +
    "<span class=\"monat\">" + MONATE[kalMonat.getUTCMonth()] + " " + kalMonat.getUTCFullYear() + "</span>" +
    "<button data-aktion=\"kal-monat\" data-schritt=\"1\">›</button></div>");
  b.push("<div class=\"kalgitter\">");
  for (const w of WOCHENTAGE) b.push("<div class=\"wt\">" + w + "</div>");
  const start = addDays(kalMonat, -weekday(kalMonat));
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const fremd = d.getUTCMonth() !== kalMonat.getUTCMonth();
    const s = schichtAm(d, cfgS);
    const cls = ["kaltag", fremd ? "fremd" : "", gleich(d, h) ? "heute" : "",
      gleich(d, kalTag) ? "gewaehlt" : ""].filter(Boolean).join(" ");
    let punkte = "";
    if ((proTag[iso(d)] || []).length) punkte += "<span class=\"punkt\"></span>";
    if ((todosTag[iso(d)] || []).length) punkte += "<span class=\"punkt fael\"></span>";
    b.push("<button class=\"" + cls + "\" data-aktion=\"kal-tag\" data-datum=\"" + iso(d) + "\">" +
      "<span>" + d.getUTCDate() + "</span>" +
      "<span class=\"schichtk\">" + (s ? esc(s.name[0]) : "") + "</span>" +
      "<span class=\"punkte\">" + punkte + "</span></button>");
  }
  b.push("</div>");

  const s = schichtAm(kalTag, cfgS);
  b.push("<div class=\"karte\" style=\"margin-top:12px\"><h3>" + esc(kurzDatum(kalTag)) +
    " <span class=\"zusatz\">" + esc(s ? s.name + " " + s.von + " bis " + s.bis : "frei") + "</span></h3>");
  const tt = proTag[iso(kalTag)] || [];
  const td = todosTag[iso(kalTag)] || [];
  if (!tt.length && !td.length) b.push("<div class=\"leer\">Nichts an dem Tag.</div>");
  for (const t of tt) {
    b.push("<div class=\"termin\" data-aktion=\"termin-menue\" data-datum=\"" + iso(t.datum) + "\" data-titel=\"" + esc(t.titel) + "\">" +
      "<span class=\"wann\">" + (t.zeit ? esc(t.zeit) : "Termin") + "</span>" +
      "<span class=\"titel\">" + verlinke(t.titel) +
      (t.notiz ? " <span class=\"zeit\">" + verlinke(t.notiz) + "</span>" : "") + "</span></div>");
  }
  if (td.length) {
    b.push("<div class=\"sektionstitel\">Fällige Todos</div>");
    b.push(td.map((t) => todoZeileHtml(t, false)).join(""));
  }
  b.push("<div style=\"margin-top:10px\"><button class=\"knopf zweit\" data-aktion=\"termin-neu\">+ Termin am " + kurzDatum(kalTag) + "</button></div>");
  b.push("</div>");

  $("#teil-kalender").innerHTML = b.join("");
}

// ----------------------------------------------------------- Tagebuch

let tbDirty = false;      // Nutzer tippt gerade im Editor
let tbRenderTag = null;   // Tag, fuer den der Editor gerade gefuellt ist

function renderTagebuch() {
  if (!tbTag) tbTag = heute();
  // Waehrend Can tippt, nichts ueberschreiben (renderAlles laeuft auch
  // nach Habit-Klicks und so weiter).
  if (tbDirty && tbRenderTag && gleich(tbTag, tbRenderTag) && $("#tbedit")) return;

  const pfad = "Tagebuch/" + punktDatum(tbTag) + ".md";
  const vorhanden = tagebuchNamen.includes(punktDatum(tbTag) + ".md");
  const inhalt = ablage.has(pfad) ? text(pfad) : null;

  const b = [];
  b.push("<div class=\"sektionstitel\" style=\"margin:20px 0 10px\">Tagebuch</div>");
  b.push("<div class=\"tbnav\"><button data-aktion=\"tb-tag\" data-schritt=\"-1\">‹</button>" +
    "<span class=\"datum\">" + langDatum(tbTag) + "</span>" +
    "<button data-aktion=\"tb-tag\" data-schritt=\"1\"" + (gleich(tbTag, heute()) ? " disabled" : "") + ">›</button></div>");

  if (vorhanden && inhalt === null) {
    b.push("<div class=\"karte\"><div class=\"leer\">Eintrag existiert, aber noch nicht geladen.</div>" +
      "<button class=\"knopf zweit\" data-aktion=\"tb-laden\" style=\"margin-top:8px\">Laden</button></div>");
  } else {
    b.push("<div class=\"karte\"><h3>Eintrag" +
      (inhalt === null || !inhalt.trim() ? " <span class=\"zusatz\">noch leer</span>" : "") + "</h3>" +
      "<textarea id=\"tbedit\" class=\"tbedit\" placeholder=\"Was war heute? [wort] wird zum Wikilink, Schlagworte verlinken sich von selbst.\">" +
      esc(inhalt === null ? "" : nl(inhalt)) + "</textarea>" +
      (inhalt === null || !inhalt.trim()
        ? "<button class=\"knopf zweit\" data-aktion=\"tb-vorlage\" style=\"margin-bottom:9px\">Vorlage einfügen</button>"
        : "") +
      "<button class=\"knopf\" data-aktion=\"tb-voll-speichern\">Speichern</button>" +
      "<div class=\"hilfetext\" style=\"margin-top:8px\">Du editierst direkt die Datei, wie am PC. " +
      "Jeder Stand landet als Commit in git, nichts geht verloren.</div></div>");
  }

  $("#teil-tagebuch").innerHTML = b.join("");
  tbRenderTag = tbTag;
  tbDirty = false;
  const ta = $("#tbedit");
  if (ta) ta.addEventListener("input", () => { tbDirty = true; });
}

// ------------------------------------------------------------- Sozial

function renderSozial() {
  const daten = parseSozial(text("Dashboard/Sozial.md"));
  const woche = sozialWoche(daten);
  const bilanz = sozialBilanz(daten);
  const werk = sozialWerkzeug();
  const b = [];

  b.push("<div class=\"karte\"><h3>Diese Woche</h3>" +
    "<div class=\"gross\">" + woche.tage + " von " + woche.ziel + " Tagen</div>" +
    "<div class=\"balken\"><div class=\"voll\" style=\"width:" + Math.min(100, Math.round(woche.tage / woche.ziel * 100)) + "%\"></div></div>" +
    (woche.heute ? "<div class=\"hinweis gruen\">Heute schon geübt. Beweis gesammelt.</div>" : "") +
    "</div>");

  const aktuelle = daten.stufen.find((s) => s.stufe === daten.stufe);
  b.push("<div class=\"karte\"><h3>Aktuelle Stufe <span class=\"zusatz\">Stufe " + daten.stufe + "</span></h3>");
  if (aktuelle) {
    b.push("<div><strong>" + esc(aktuelle.uebung) + "</strong></div>" +
      (aktuelle.hinweis ? "<div class=\"hilfetext\" style=\"margin-top:4px\">" + esc(aktuelle.hinweis) + "</div>" : ""));
  }
  if (sozialBereitFuerMehr(daten)) {
    b.push("<div class=\"hinweis gruen\">Die letzten drei Übungen waren leicht. Zeit für die nächste Stufe.</div>");
  }
  if (daten.plan) b.push("<div class=\"hinweis\">" + esc(daten.plan) + "</div>");
  b.push("<details class=\"liste-details\" style=\"margin-top:8px\"><summary><span class=\"pfeil\">▶</span>Alle Stufen</summary>");
  for (const s of daten.stufen) {
    b.push("<div class=\"stufenzeile" + (s.stufe === daten.stufe ? " aktivstufe" : "") + "\">" +
      "<span class=\"nr\">" + s.stufe + "</span><span class=\"uebung\">" + esc(s.uebung) + "</span>" +
      (s.stufe !== daten.stufe ? "<button class=\"waehlen\" data-aktion=\"sozial-stufe\" data-stufe=\"" + s.stufe + "\">wählen</button>" : "") +
      "</div>");
  }
  b.push("</details></div>");

  b.push("<div class=\"karte\"><h3>Übung eintragen</h3>");
  b.push("<label class=\"feld\">Übung</label><select id=\"sozial-kuerzel\">");
  for (const s of daten.stufen) {
    b.push("<option value=\"" + esc(s.kuerzel) + "\"" + (s.stufe === daten.stufe ? " selected" : "") + ">" +
      s.stufe + " · " + esc(s.uebung) + "</option>");
  }
  b.push("<option value=\"frei\">Freie Übung</option></select>");
  const zahlOpts = (id) => {
    let o = "<select id=\"" + id + "\"><option value=\"-\">nicht erfasst</option>";
    for (let i = 0; i <= 10; i++) o += "<option value=\"" + i + "\">" + i + "</option>";
    return o + "</select>";
  };
  b.push("<div class=\"zeile2\"><div><label class=\"feld\">Vorher befürchtet (0 bis 10)</label>" + zahlOpts("sozial-vorher") + "</div>" +
    "<div><label class=\"feld\">Nachher wirklich (0 bis 10)</label>" + zahlOpts("sozial-nachher") + "</div></div>");
  b.push("<label class=\"feld\">Notiz, optional</label><input type=\"text\" id=\"sozial-notiz\">");
  b.push("<button class=\"knopf\" data-aktion=\"sozial-log\">Eintragen</button></div>");

  if (bilanz.n) {
    b.push("<div class=\"karte\"><h3>Erwartung gegen Realität <span class=\"zusatz\">" + bilanz.n + " Übungen</span></h3>" +
      "<div class=\"bilanzzeile\">" +
      "<div class=\"wert\"><div class=\"zahl\">" + bilanz.vorher.toFixed(1) + "</div><div class=\"label\">befürchtet</div></div>" +
      "<div class=\"wert\"><div class=\"zahl\">" + bilanz.nachher.toFixed(1) + "</div><div class=\"label\">erlebt</div></div>" +
      "<div class=\"wert\"><div class=\"zahl\">" + bilanz.leichter + "×</div><div class=\"label\">leichter als gedacht</div></div>" +
      "</div></div>");
  }

  b.push("<div class=\"karte werk\"><h3>Werkzeug der Woche</h3>" +
    "<div><strong>" + esc(werk.name) + "</strong></div>" +
    "<div class=\"tu\">" + esc(werk.tu) + "</div>" +
    "<div class=\"warum\">" + esc(werk.warum) + "</div>" +
    "<div class=\"quelle\">" + esc(werk.quelle) + "</div></div>");

  const letzte = daten.log.slice(-6).reverse();
  if (letzte.length) {
    b.push("<div class=\"karte\"><h3>Letzte Übungen</h3>");
    for (const x of letzte) {
      b.push("<div class=\"logzeile\"><div class=\"kopf\"><span class=\"datum\">" + kurzDatum(x.datum) + "</span>" +
        "<span>" + esc(x.kuerzel) + "</span>" +
        "<span class=\"zahlen\">" + (x.vorher === null ? "-" : x.vorher) + " → " + (x.nachher === null ? "-" : x.nachher) + "</span></div>" +
        (x.notiz ? "<div class=\"notiz\">" + esc(x.notiz) + "</div>" : "") + "</div>");
    }
    b.push("</div>");
  }

  $("#blatt-sozial").innerHTML = b.join("");
}

// ---------------------------------------------------------- Training

let trEingaben = {};   // uebung -> {gew, wdh}, damit die Felder beim
                       // Neuzeichnen nach jedem Satz gefuellt bleiben

function trainingWann(d) {
  const n = tageDiff(heute(), d);
  if (n === 0) return "heute";
  if (n === 1) return "gestern";
  return "vor " + n + " Tagen";
}

function trainingSaetzeKurz(saetze) {
  return saetze.map(trainingSatzText).join(", ");
}

function renderTraining() {
  const d = parseTraining(text("Dashboard/Training.md"));
  const h = iso(heute());
  const b = [];

  b.push("<div class=\"karte\"><h3>Trainingstage</h3>");
  if (d.tage.length) {
    b.push("<div class=\"chips\">");
    d.tage.forEach((t, n) => {
      b.push("<button class=\"chip" + (n === 0 ? " an" : "") + "\" data-aktion=\"training-tag-oben\" data-tag=\"" + esc(t) + "\"" + (n === 0 ? " data-oben=\"1\"" : "") + ">" + esc(t) + "</button>");
    });
    b.push("<button class=\"chip leise\" data-aktion=\"training-tag-neu\">+ Tag</button>");
    b.push("</div>");
    b.push("<div class=\"hilfetext\" style=\"margin-top:8px\">Tippen schiebt den Tag nach ganz oben, der oberste ist dein aktueller Tag.</div>");
  } else {
    b.push("<div class=\"hilfetext\">Noch keine Trainingstage. Leg den ersten an, zum Beispiel Push.</div>");
    b.push("<button class=\"knopf zweit\" data-aktion=\"training-tag-neu\" style=\"margin-top:8px\">+ Trainingstag anlegen</button>");
  }
  b.push("</div>");

  if (d.tage.length) {
    const akt = d.tage[0];
    const uebungen = d.uebungen[akt] || [];
    if (!uebungen.length) {
      b.push("<div class=\"karte\"><h3>" + esc(akt) + "</h3><div class=\"hilfetext\">Noch keine Übungen für " + esc(akt) + ". Leg unten die erste an.</div></div>");
    }
    for (const u of uebungen) {
      const eintraege = d.log.filter((x) => x.uebung.toLowerCase() === u.toLowerCase());
      let heuteE = null;
      for (const x of eintraege) {
        if (iso(x.datum) === h && x.tag.toLowerCase() === akt.toLowerCase()) heuteE = x;
      }
      const frueher = eintraege.filter((x) => iso(x.datum) !== h);
      const gewichte = [];
      for (const x of eintraege) {
        for (const s of x.saetze) if (s.gewicht !== null) gewichte.push(s.gewicht);
      }
      const bestes = gewichte.length ? Math.max.apply(null, gewichte) : null;

      b.push("<div class=\"karte\"><h3>" + esc(u) +
        (bestes !== null ? " <span class=\"zusatz\">Bestes " + trainingGewichtText(bestes) + " kg</span>" : "") + "</h3>");
      if (frueher.length) {
        const x = frueher[frueher.length - 1];
        b.push("<div class=\"hilfetext\">Letztes Mal " + trainingWann(x.datum) + ": " + esc(trainingSaetzeKurz(x.saetze)) + "</div>");
      }
      if (heuteE) {
        b.push("<div class=\"trsaetze\">" + heuteE.saetze.map(
          (s, i) => "<button class=\"trsatz\" data-aktion=\"training-satz-edit\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\" data-nr=\"" + i + "\">" + esc(trainingSatzText(s)) + "</button>").join("") + "</div>");
        b.push("<div class=\"hilfetext\">Satz antippen zum Ändern oder Löschen.</div>");
      }
      const eing = trEingaben[u] || {};
      b.push("<div class=\"zeile2\"><div><label class=\"feld\">Gewicht in kg, leer ohne</label>" +
        "<input type=\"number\" step=\"0.25\" inputmode=\"decimal\" class=\"tr-gew\" value=\"" + esc(eing.gew || "") + "\"></div>" +
        "<div><label class=\"feld\">Wiederholungen</label>" +
        "<input type=\"number\" inputmode=\"numeric\" class=\"tr-wdh\" value=\"" + esc(eing.wdh || "") + "\"></div></div>");
      b.push("<button class=\"knopf\" data-aktion=\"training-satz\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\">+ Satz eintragen</button>");
      if (!heuteE && frueher.length) {
        b.push("<button class=\"knopf zweit\" data-aktion=\"training-uebernehmen\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\" style=\"margin-top:8px\">Wie letztes Mal (" + esc(trainingSaetzeKurz(frueher[frueher.length - 1].saetze)) + ")</button>");
      }
      b.push("<details class=\"liste-details\" style=\"margin-top:8px\"><summary><span class=\"pfeil\">▶</span>Verlauf<span class=\"anzahl\">" +
        eintraege.length + (eintraege.length === 1 ? " Einheit" : " Einheiten") + "</span></summary>");
      for (const x of eintraege.slice(-10).reverse()) {
        b.push("<div class=\"logzeile\"><div class=\"kopf\"><span class=\"datum\">" + kurzDatum(x.datum) + "</span>" +
          "<span>" + esc(x.tag) + "</span>" +
          "<span class=\"zahlen\">" + esc(trainingSaetzeKurz(x.saetze)) + "</span></div></div>");
      }
      b.push("<button class=\"knopf zweit\" data-aktion=\"training-uebung-weg\" data-tag=\"" + esc(akt) + "\" data-uebung=\"" + esc(u) + "\" style=\"margin-top:8px\">Übung aus dem Plan nehmen</button>");
      b.push("</details></div>");
    }

    b.push("<div class=\"karte\"><h3>Übung hinzufügen <span class=\"zusatz\">" + esc(akt) + "</span></h3>" +
      "<input type=\"text\" id=\"tr-neuueb\" placeholder=\"Name der Übung\">" +
      "<button class=\"knopf\" data-aktion=\"training-uebung-neu\" data-tag=\"" + esc(akt) + "\" style=\"margin-top:8px\">Hinzufügen</button></div>");
  }

  if (d.log.length) {
    const gruppen = new Map();
    for (const x of d.log) {
      const k = iso(x.datum) + "|" + x.tag;
      if (!gruppen.has(k)) gruppen.set(k, []);
      gruppen.get(k).push(x);
    }
    const keys = Array.from(gruppen.keys()).sort().reverse().slice(0, 8);
    b.push("<div class=\"karte\"><h3>Letzte Einheiten</h3>");
    for (const k of keys) {
      const xs = gruppen.get(k);
      const teile = k.split("|");
      let ns = 0;
      for (const x of xs) ns += x.saetze.length;
      b.push("<div class=\"logzeile\"><div class=\"kopf\"><span class=\"datum\">" + kurzDatum(parseDateIso(teile[0])) + "</span>" +
        "<span>" + esc(teile[1]) + "</span>" +
        "<span class=\"zahlen\">" + xs.length + (xs.length === 1 ? " Übung" : " Übungen") + ", " + ns + " Sätze</span></div></div>");
    }
    b.push("</div>");
  }

  $("#blatt-training").innerHTML = b.join("");
}

function trainingHeutigeRoh(t, tag, uebung) {
  // Heutige Saetze als rohe Eingaben, so wie trainingSaetzeSetzen sie will.
  const d = parseTraining(t);
  const h = iso(heute());
  const e2 = d.log.find((x) => iso(x.datum) === h
    && x.tag.toLowerCase() === String(tag).toLowerCase()
    && x.uebung.toLowerCase() === String(uebung).toLowerCase());
  return e2 ? e2.saetze.map((s) => ({
    gewicht: s.gewicht === null ? "" : trainingGewichtText(s.gewicht),
    wdh: String(s.wdh),
  })) : [];
}

function medienGlTexte() {

function medienNotizPfad(kat, titel) {
  // Spiele-Notizen wohnen historisch unter Gaming/Games.
  if (kat === "spiel") return "Gaming/Games/" + notizName(titel) + ".md";
  return "Medien/" + MEDIEN_ORDNER[kat] + "/" + notizName(titel) + ".md";
}

// Notiz-Pfad zum Titel: erst der Kategorie-Ordner, dann flach daneben.
// Gibt {pfad, sha} des ersten Treffers, sonst den Ordner-Pfad ohne sha.
async function medienNotizFinden(kat, titel) {
  const haupt = medienNotizPfad(kat, titel);
  const d = await ladeDatei(haupt);
  if (d.sha) return { pfad: haupt, eintrag: d };
  const flach = (kat === "spiel" ? "Gaming/" : "Medien/") + notizName(titel) + ".md";
  const d2 = await ladeDatei(flach);
  if (d2.sha) return { pfad: flach, eintrag: d2 };
  return { pfad: haupt, eintrag: d };
}

let rezSuche = "";
let rezFilter = "";

function alleRezepte() {
  const out = [];
  for (const n of rezNamen) {
    const pfad = "Rezepte/" + n;
    if (!ablage.has(pfad)) continue;
    const r = rezeptParsen(text(pfad), n.slice(0, -3));
    r.datei = n;
    out.push(r);
  }
  out.sort((a, b) => {
    const x = a.titel.toLowerCase(), y = b.titel.toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  });
  return out;
}

// Zeitstempel der Warteschlange aus der lokalen Uhr, wie datetime.now()
// am PC. Format JJJJ-MM-TT HH:MM.
function jetztStempel() {
  const d = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function katChips(aktiv, id) {

  for (const k of kochplan) {
    (geplant[k.titel] = geplant[k.titel] || []).push(k.datum);

  // Kochplan, steht als ganz normaler Termin im Kalender.

    b.push("<div class=\"hilfetext\" style=\"margin-top:10px\">Warteschlange leer, " +
      queue.fertig.length + " Video" + (queue.fertig.length === 1 ? "" : "s") + " schon verarbeitet.</div>");
  }
  b.push("</div>");

  $("#blatt-rezepte").innerHTML = b.join("");
  const suche = $("#rezsuche");
  if (suche) {
    suche.addEventListener("input", () => { rezSuche = suche.value; rezFiltern(); });
  }
  rezFiltern();
}

// Blendet Karten aus statt neu zu rendern, sonst verliert das Suchfeld
// bei jedem Buchstaben den Fokus.
function rezFiltern() {
  const q = rezSuche.trim().toLowerCase();
  let sichtbar = 0;
  document.querySelectorAll("#blatt-rezepte .rezkarte").forEach((el) => {
    const kats = " " + el.dataset.kat + " ";
    const passt = (!rezFilter || kats.includes(" " + rezFilter + " "))
      && (!q || el.dataset.suche.includes(q));
    el.style.display = passt ? "" : "none";
    if (passt) sichtbar += 1;
  });
  const zahl = $("#rezzahl");
  if (zahl) zahl.textContent = sichtbar + (rezSuche.trim() || rezFilter ? " von " + document.querySelectorAll("#blatt-rezepte .rezkarte").length : "");
}

    if (e.keinToken) einstellungenSheet(true);

        const roh = trainingHeutigeRoh(texte["Dashboard/Training.md"], tag, uebung);
        if (nr >= roh.length) throw new Error("Satz nicht mehr da, bitte neu laden");
        roh[nr] = { gewicht: gew, wdh };
        return { "Dashboard/Training.md": trainingSaetzeSetzen(texte["Dashboard/Training.md"], tag, uebung, roh, iso(heute())).text };
      }, "Mobil: Training " + uebung + " Satz geaendert"), "Satz geändert");
  },
  "training-satz-loeschen": async (el) => {
    const { tag, uebung } = el.dataset;
    const nr = parseInt(el.dataset.nr, 10);
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Training.md"],
      (texte) => {
        const roh = trainingHeutigeRoh(texte["Dashboard/Training.md"], tag, uebung);
        if (nr >= roh.length) throw new Error("Satz nicht mehr da, bitte neu laden");
        roh.splice(nr, 1);
        return { "Dashboard/Training.md": trainingSaetzeSetzen(texte["Dashboard/Training.md"], tag, uebung, roh, iso(heute())).text };
      }, "Mobil: Training " + uebung + " Satz raus"), "Satz ist raus");
  },
  "training-uebernehmen": async (el) => {
    const { tag, uebung } = el.dataset;
    await mitToast(() => transaktion(["Dashboard/Training.md", "Dashboard/Habits.md"],
      (texte) => {
        const d = parseTraining(texte["Dashboard/Training.md"]);
        const h = iso(heute());
        const frueher = d.log.filter((x) => x.uebung.toLowerCase() === uebung.toLowerCase() && iso(x.datum) !== h);
        if (!frueher.length) throw new Error("Kein letztes Mal gefunden");
        const roh = frueher[frueher.length - 1].saetze.map((s) => ({
          gewicht: s.gewicht === null ? "" : trainingGewichtText(s.gewicht),
          wdh: String(s.wdh),
        }));
        const r = trainingSaetzeSetzen(texte["Dashboard/Training.md"], tag, uebung, roh, h);
        const hb = habitSetzen(texte["Dashboard/Habits.md"], "gym", true, h);
        return { "Dashboard/Training.md": r.text, "Dashboard/Habits.md": hb.text };
      }, "Mobil: Training " + uebung + " wie letztes Mal"),
    "Übernommen, jetzt einzelne Sätze antippen zum Anpassen");
  },

  "kal-monat": (el) => { kalMonat = plusMonat(kalMonat, parseInt(el.dataset.schritt, 10)); renderKalender(); },
  "kal-tag": (el) => {
    kalTag = parseDate(el.dataset.datum);
    if (kalTag.getUTCMonth() !== kalMonat.getUTCMonth()) {
      kalMonat = makeDate(kalTag.getUTCFullYear(), kalTag.getUTCMonth() + 1, 1);
    }
    renderKalender();
  },
  "termin-neu": () => neuerTerminSheet(iso(kalTag || heute())),
  "termin-anlegen": async () => {
    const titel = $("#tm-titel").value.trim();
    const datum = $("#tm-datum").value;
    const zeit = $("#tm-zeit").value;
    const notiz = $("#tm-notiz").value.trim();
    if (!titel) { toast("Titel fehlt", true); return; }
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": kalenderAnlegen(texte["Dashboard/Kalender.md"], datum, titel, zeit, notiz).text }),
      "Mobil: Termin angelegt"), "Termin angelegt");
  },
  "termin-menue": (el) => terminMenue(el.dataset.datum, el.dataset.titel),
  "termin-loeschen": async (el) => {
    const { datum, titel } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": terminLoeschen(texte["Dashboard/Kalender.md"], datum, titel).text }),
      "Mobil: Termin geloescht"), "Termin gelöscht");
  },
  "termin-schieben": async (el) => {
    const { datum, titel, wann } = el.dataset;
    sheetZu();
    await mitToast(() => transaktion(["Dashboard/Kalender.md"],
      (texte) => ({ "Dashboard/Kalender.md": terminVerschieben(texte["Dashboard/Kalender.md"], datum, titel, wann).text }),
      "Mobil: Termin verschoben"), "Termin verschoben auf " + VERSCHIEBEN[wann][0]);
  },

  "tb-tag": (el) => {
    if (tbDirty && !confirm("Ungespeicherte Änderungen verwerfen?")) return;
    tbDirty = false;
    tbTag = addDays(tbTag, parseInt(el.dataset.schritt, 10));
    renderTagebuch();
  },
  "tb-laden": async () => {
    await mitToast(() => ladeDatei("Tagebuch/" + punktDatum(tbTag) + ".md"));
  },
  "tb-vorlage": () => {
    const ta = $("#tbedit");
    if (ta && !ta.value.trim()) { ta.value = tagebuchVorlage(tbTag); tbDirty = true; }
  },
  "tb-voll-speichern": async () => {
    const eingabe = $("#tbedit").value;
    if (!eingabe.trim()) { toast("Eintrag ist leer, so speichere ich nicht", true); return; }
    const tag = tbTag;
    const pfad = "Tagebuch/" + punktDatum(tag) + ".md";
    await mitToast(async () => {
      const vorhanden = await alleNotizNamen();
      const worte = parseSchlagworte(text("Dashboard/Schlagworte.md"));
      const stubs = [];
      await transaktion([pfad], () => {
        const kopie = new Map(vorhanden);
        const r = tagebuchSpeichern(eingabe, kopie, worte);
        stubs.length = 0;
        stubs.push.apply(stubs, r.angelegt);
        return { [pfad]: r.content };
      }, "Mobil: Tagebuch " + iso(tag));
      for (const name of stubs) {
        try { await putDatei(name + ".md", "", "Mobil: Notiz " + name + " angelegt"); }
        catch (e) { /* Stub gibt es wohl schon, egal */ }
      }
      if (!tagebuchNamen.includes(punktDatum(tag) + ".md")) {
        tagebuchNamen.push(punktDatum(tag) + ".md");
        tagebuchNamen.sort();
      }
      cacheSpeichern();
      tbDirty = false;
      return stubs;
    }, "Gespeichert");
  },

  "sozial-log": async () => {
    const kuerzel = $("#sozial-kuerzel").value;
    const vorher = $("#sozial-vorher").value;
    const nachher = $("#sozial-nachher").value;
    const notiz = $("#sozial-notiz").value;
    await mitToast(() => transaktion(["Dashboard/Sozial.md", "Dashboard/Habits.md"],
      (texte) => {
        const daten = parseSozial(texte["Dashboard/Sozial.md"]);
        const bekannt = new Set(daten.stufen.map((x) => x.kuerzel));
        bekannt.add("frei");
        const r = sozialLog(texte["Dashboard/Sozial.md"], kuerzel, vorher, nachher, notiz, iso(heute()), bekannt);
        const h = habitSetzen(texte["Dashboard/Habits.md"], "sozial", true, iso(heute()));
        return { "Dashboard/Sozial.md": r.text, "Dashboard/Habits.md": h.text };
      }, "Mobil: Soziale Uebung " + kuerzel), "Eingetragen. Beweis gesammelt.");
  },
  "sozial-stufe": async (el) => {
    const stufe = parseInt(el.dataset.stufe, 10);
    await mitToast(() => transaktion(["Dashboard/Sozial.md"],
      (texte) => {
        const daten = parseSozial(texte["Dashboard/Sozial.md"]);
        return { "Dashboard/Sozial.md": sozialStufeSetzen(texte["Dashboard/Sozial.md"], stufe, daten.stufen.map((x) => x.stufe)).text };
      }, "Mobil: Sozial-Stufe " + stufe), "Stufe " + stufe + " gesetzt");
  },

  "medien-notiz": async (el) => {
    const det = el.closest("details");
    det.open = !det.open;
    const box = det.querySelector(".mednotizinhalt");
    if (!det.open || box.dataset.geladen === "1") return;
    box.textContent = "Lade...";
    try {
      const fund = await medienNotizFinden(el.dataset.kat, el.dataset.titel);
      box.textContent = fund.eintrag.text.trim() || "Noch keine Notiz.";
      box.dataset.geladen = "1";
    } catch (e) { box.textContent = "Laden fehlgeschlagen: " + e.message; }
  },
  "medien-merken": async (el) => {
    const { kat, titel } = el.dataset;
    const karte = el.closest(".karte");
    let wert = karte.querySelector(".med-fort").value.trim();
    const pl = karte.querySelector(".med-plat");
    if (pl) wert = spielFortschrittBauen(pl.value, wert);
    const wl = "Medien/" + medienKat(kat)[2];
    await mitToast(() => transaktion([wl],
      (texte) => ({ [wl]: medienFortschritt(texte[wl], titel, wert).text }),
      "Mobil: " + titel + " Fortschritt"), "Gemerkt");
  },
  "medien-fertig-frage": (el) => medienFertigSheet(el.dataset.kat, el.dataset.titel),
  "medien-fertig": async (el) => {
    const { kat, titel } = el.dataset;
    const bew = $("#med-bew").value.trim();
    const textOpt = $("#med-text").value.trim();
    sheetZu();
    const k = medienKat(kat);
    const wl = "Medien/" + k[2], gl = "Medien/" + k[3];
    await mitToast(async () => {
      const fund = await medienNotizFinden(kat, titel);
      await transaktion([wl, gl, fund.pfad], (texte) => {
        const r = medienFertig(texte[wl], texte[gl], titel, bew);
        const out = { [wl]: r.wlText, [gl]: r.glText };
        const neu = [];
        if (r.zusatz) neu.push(r.zusatz);
        if (r.note || textOpt) neu.push((r.note.trim() + " " + textOpt).trim());
        const n = medienNotizErgaenzen(texte[fund.pfad], neu);
        if (n !== null) out[fund.pfad] = n;
        return out;
      }, "Mobil: " + titel + " " + k[5]);
    }, "Als " + k[5] + " gespeichert");
  },
  "medien-start": async (el) => {
    const { kat, titel } = el.dataset;
    sheetZu();
    medVorschlag = null;
    const wl = "Medien/" + medienKat(kat)[2];
    await mitToast(() => transaktion([wl],
      (texte) => ({ [wl]: medienAufstarten(texte[wl], titel).text }),
      "Mobil: " + titel + " gestartet"), titel + " läuft jetzt");
  },
  "medien-add": async () => {
    const titel = $("#med-neutitel").value.trim();
    const kat = $("#med-neukat").value;
    if (!titel) { toast("Titel fehlt", true); return; }
    const k = medienKat(kat);
    const wl = "Medien/" + k[2];
    await mitToast(async () => {
      let neu = null;
      await transaktion([wl], (texte) => {
        const r = medienHinzufuegen(texte[wl], titel);
        neu = r.titel;
        if (r.text === null) throw new Error("Steht schon auf der Watchliste");
        return { [wl]: r.text };
      }, "Mobil: " + titel + " auf die Watchliste");
      const fund = await medienNotizFinden(kat, neu);
      if (!fund.eintrag.sha) {
        try { await putDatei(fund.pfad, "", "Mobil: Notiz " + neu + " angelegt"); }
        catch (e) { /* Notiz gibt es wohl schon, egal */ }
      }
    }, "Auf der Watchliste");
  },
  "medien-wuerfeln": () => {
    const wahl = $("#med-wkat");
    medWuerfelKat = wahl ? wahl.value : medWuerfelKat;
    const m = parseMedienAlle(medienWlTexte());
    const topf = medWuerfelKat ? m.backlog.filter((x) => x.kat === medWuerfelKat) : m.backlog;
    if (!topf.length) { toast("Kein offener Titel in dem Topf", true); return; }
    medVorschlag = topf[Math.floor(Math.random() * topf.length)];
    renderMedien();
  },
  "medien-titel-menue": (el) => medienTitelSheet(el.dataset.kat, el.dataset.titel, el.dataset.zusatz),
  "medien-kat": (el) => {
    medKat = el.dataset.kat;
    medWuerfelKat = medKat;   // der Wuerfel folgt dem Untertab
    medVorschlag = null;
    try { localStorage.setItem("medkat", medKat); } catch (e) { /* egal */ }
    renderMedien();
    window.scrollTo(0, 0);
  },

  "rez-filter": (el) => {
    rezFilter = el.dataset.filter;
    document.querySelectorAll("#rezfilter .chip").forEach((x) =>
      x.classList.toggle("an", x.dataset.filter === rezFilter));
    rezFiltern();
  },
  "katchip": (el) => el.classList.toggle("an"),
  "rez-neu": () => rezeptSheet(null),
  "rez-bearbeiten": (el) => rezeptSheet(el.dataset.datei),
  "rez-speichern": async (el) => {
    const datei = el.dataset.datei;
    const felder = rezFelderLesen();
    let neu;
    try {
      neu = datei
        ? rezeptBearbeiten(text("Rezepte/" + datei), datei, felder)
        : rezeptNeu(felder);
    } catch (e) { toast(e.message, true); return; }
    sheetZu();
    await mitToast(async () => {
      const pfad = "Rezepte/" + neu.datei;
      if (!datei) {
        await transaktion([pfad], (texte) => {
          if (texte[pfad].trim()) throw new Error("Gibt es schon: " + neu.datei);
          return { [pfad]: neu.text };
        }, "Mobil: Rezept angelegt");
      } else {
        const altPfad = "Rezepte/" + datei;
        if (pfad !== altPfad && (await holeDatei(pfad)).text.trim()) {
          throw new Error("Es gibt schon ein Rezept namens " + neu.titel);
        }
        const kal = "Dashboard/Kalender.md";
        const umbenannt = neu.titel !== neu.altTitel;
        const pfade = umbenannt ? [pfad, kal] : [pfad];
        await transaktion(pfade, (texte) => {
          const out = { [pfad]: neu.text };
          if (umbenannt) out[kal] = kochtermineUmbenennen(texte[kal], neu.altTitel, neu.titel);
          return out;
        }, "Mobil: Rezept bearbeitet");
        if (pfad !== altPfad) {
          await loeschDatei(altPfad, "Mobil: Rezept umbenannt");
          rezNamen = rezNamen.filter((x) => x !== datei);
        }
      }
      if (!rezNamen.includes(neu.datei)) { rezNamen.push(neu.datei); rezNamen.sort(); }
      cacheSpeichern();
    }, datei ? "Rezept gespeichert" : "Rezept angelegt");
  },
  "rez-plan": (el) => rezeptPlanSheet(el.dataset.titel),
  "rez-plan-speichern": async (el) => {
    const titel = el.dataset.titel;
    const datum = $("#rp-datum").value;
    if (!datum) { toast("Kein Datum gewählt", true); return; }
    sheetZu();
    const kal = "Dashboard/Kalender.md";
    await mitToast(() => transaktion([kal],
      (texte) => ({ [kal]: rezeptEinplanen(texte[kal], titel, datum, "").text }),
      "Mobil: Rezept eingeplant"), "Eingeplant");
  },
  "rez-absagen": async (el) => {
    const titel = el.dataset.titel, datum = el.dataset.datum;
    const kal = "Dashboard/Kalender.md";
    await mitToast(() => transaktion([kal],
      (texte) => ({ [kal]: rezeptAusplanen(texte[kal], titel, datum).text }),
      "Mobil: Kochtermin abgesagt"), "Abgesagt");
  },
  "rez-archiv-frage": (el) => rezeptArchivSheet(el.dataset.datei, el.dataset.titel),
  "rez-archivieren": async (el) => {
    const datei = el.dataset.datei, titel = el.dataset.titel;
    sheetZu();
    await mitToast(async () => {
      const pfad = "Rezepte/" + datei;
      const inhalt = (await holeDatei(pfad)).text;
      const liste = await ladeOrdner("Rezepte/" + REZEPT_ARCHIV).catch(() => []);
      const namen = liste.filter((e) => e.type === "file").map((e) => e.name);
      const basis = datei.slice(0, -3);
      let ziel = basis + ".md", n = 2;
      while (namen.includes(ziel)) { ziel = basis + " (" + n + ").md"; n += 1; }
      await putDatei("Rezepte/" + REZEPT_ARCHIV + "/" + ziel, inhalt, "Mobil: Rezept archiviert");
      await loeschDatei(pfad, "Mobil: Rezept archiviert");
      rezNamen = rezNamen.filter((x) => x !== datei);
      cacheSpeichern();
    }, titel + " archiviert");
  },
  "rez-video": () => rezeptVideoSheet(),
  "rez-queue-anlegen": async () => {
    const url = $("#rv-url").value.trim();
    const notiz = $("#rv-text").value;
    const kats = katChipsLesen("rv-kat");
    const stempel = jetztStempel();
    try {
      rezeptQueueAnlegen(text(REZEPT_QUEUE_PFAD), url, notiz, stempel, kats);
    } catch (e) { toast(e.message, true); return; }
    sheetZu();
    await mitToast(() => transaktion([REZEPT_QUEUE_PFAD],
      (texte) => ({ [REZEPT_QUEUE_PFAD]:
        rezeptQueueAnlegen(texte[REZEPT_QUEUE_PFAD], url, notiz, stempel, kats).text }),
      "Mobil: Video in die Warteschlange"), "In der Warteschlange");
  },
  "rez-queue-weg": async (el) => {
    const url = el.dataset.url;
    await mitToast(() => transaktion([REZEPT_QUEUE_PFAD],
      (texte) => ({ [REZEPT_QUEUE_PFAD]: rezeptQueueWeg(texte[REZEPT_QUEUE_PFAD], url).text }),
      "Mobil: Video aus der Warteschlange"), "Rausgenommen");
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-aktion]");
  if (!el) return;
  if (el.tagName === "A") return;
  const fn = AKTIONEN[el.dataset.aktion];
  if (fn) { ev.preventDefault(); fn(el); }
});
$("#schleier").addEventListener("click", (ev) => {
  if (ev.target === $("#schleier")) sheetZu();
});

// ------------------------------------------------------------- Start

(function start() {
  const hatCache = cacheLaden();
  renderAlles();
  AKTIONEN.tab({ dataset: { tab: "heute" } });
  if (!cfg.token) einstellungenSheet(true);
  else aktualisieren(hatCache);
})();
// ===APP-END===

</script>
</body>
</html>
