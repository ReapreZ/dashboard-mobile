<style>
:root {
  --bg: #1f1d1a;
  --karte: #292622;
  --karte2: #322e28;
  --rand: #3d382f;
  --text: #e7e5e4;
  --leise: #a8a29e;
  --akzent: #d97706;
  --akzent-dunkel: #b45309;
  --ok: #65a30d;
  --rot: #dc2626;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
}
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

header {
  position: sticky; top: 0; z-index: 20; background: rgba(31,29,26,.92);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--rand);
}
header .titel { font-weight: 700; font-size: 17px; }
header .datum { color: var(--leise); font-size: 13px; margin-top: 1px; }
header .frei { flex: 1; }
.kopfknopf {
  background: var(--karte); border: 1px solid var(--rand); color: var(--text);
  width: 38px; height: 38px; border-radius: 12px; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
}
.kopfknopf:active { background: var(--karte2); }
.kopfknopf.dreht svg { animation: drehen 1s linear infinite; }
@keyframes drehen { to { transform: rotate(360deg); } }

main { padding: 14px 14px 8px; max-width: 640px; margin: 0 auto; }
.blatt { display: none; }
.blatt.aktiv { display: block; }

.karte {
  background: var(--karte); border: 1px solid var(--rand);
  border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
}
.karte h3 {
  margin: 0 0 10px; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--leise); font-weight: 600;
}
.karte h3 .zusatz { float: right; text-transform: none; letter-spacing: 0; font-weight: 500; }

.schichtzeile { display: flex; align-items: baseline; gap: 10px; }
.schichtzeile .name { font-size: 19px; font-weight: 700; }
.schichtzeile .zeit { color: var(--leise); }
.schichtzeile .morgen { margin-left: auto; color: var(--leise); font-size: 13px; text-align: right; }

.todo {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 2px;
  border-top: 1px solid var(--rand);
}
.todo:first-of-type { border-top: 0; }
.todo .kreis {
  flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px;
  border: 2px solid var(--leise); border-radius: 50%; background: none;
}
.todo .kreis:active { border-color: var(--akzent); }
.todo .inhalt { flex: 1; min-width: 0; }
.todo .text { word-wrap: break-word; overflow-wrap: anywhere; }
.todo .text a { color: var(--akzent); text-decoration: none; }
.todo .meta { font-size: 12.5px; color: var(--leise); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.todo .meta .ueberfaellig { color: #f87171; }
.todo .meta .heutefaellig { color: var(--akzent); }
.prio { font-weight: 700; }
.prio.hoch { color: #f87171; }
.prio.mittel { color: var(--akzent); }
.prio.niedrig { color: var(--leise); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--rand); background: var(--karte2); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: 14.5px; line-height: 1.2;
}
.chip.an { background: var(--akzent-dunkel); border-color: var(--akzent-dunkel); color: #fff; }
.chip.leise { opacity: .55; }
.chip .strk { font-size: 11.5px; opacity: .8; margin-left: 4px; }
.leisezeile { margin-top: 10px; color: var(--leise); font-size: 12.5px; }
.leisezeile .chips { margin-top: 6px; }

.wasser { display: flex; align-items: center; gap: 12px; margin-top: 12px; border-top: 1px solid var(--rand); padding-top: 12px; }
.wasser .stand { font-size: 15px; }
.wasser .glaeser { color: var(--akzent); letter-spacing: 2px; font-size: 15px; }
.wasser button {
  margin-left: 0; width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--rand); background: var(--karte2); color: var(--text); font-size: 20px;
}
.wasser .plus { margin-left: auto; }

.termin { display: flex; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--rand); align-items: baseline; }
.termin:first-of-type { border-top: 0; }
.termin .wann { flex: 0 0 74px; color: var(--leise); font-size: 13.5px; }
.termin .titel { flex: 1; overflow-wrap: anywhere; }
.termin .zeit { color: var(--akzent); font-size: 13.5px; }

.liste-details { border-top: 1px solid var(--rand); padding: 4px 0; }
.liste-details:first-of-type { border-top: 0; }
.liste-details summary {
  list-style: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 2px; font-weight: 600; cursor: pointer;
}
.liste-details summary::-webkit-details-marker { display: none; }
.liste-details summary .anzahl { margin-left: auto; color: var(--leise); font-weight: 400; font-size: 13px; }
.liste-details summary .pfeil { transition: transform .15s; color: var(--leise); font-size: 12px; }
.liste-details[open] summary .pfeil { transform: rotate(90deg); }
.sektionstitel { color: var(--leise); font-size: 12.5px; margin: 8px 0 0; text-transform: uppercase; letter-spacing: .06em; }

.leer { color: var(--leise); font-size: 14px; padding: 4px 0; }

/* Kalender */
.kalkopf { display: flex; align-items: center; margin-bottom: 10px; }
.kalkopf .monat { flex: 1; text-align: center; font-weight: 700; font-size: 17px; }
.kalkopf button {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rand);
  background: var(--karte); color: var(--text); font-size: 17px;
}
.kalgitter { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.kalgitter .wt { text-align: center; color: var(--leise); font-size: 11.5px; padding: 3px 0; }
.kaltag {
  aspect-ratio: 1; border-radius: 10px; background: var(--karte);
  border: 1px solid var(--rand); position: relative; padding: 3px;
  display: flex; flex-direction: column; align-items: center; font-size: 13.5px;
}
.kaltag.fremd { opacity: .32; }
.kaltag.heute { border-color: var(--akzent); }
.kaltag.gewaehlt { background: var(--akzent-dunkel); border-color: var(--akzent-dunkel); color: #fff; }
.kaltag .schichtk { font-size: 9.5px; color: var(--leise); line-height: 1; }
.kaltag.gewaehlt .schichtk { color: #fde68a; }
.kaltag .punkte { display: flex; gap: 2px; margin-top: auto; margin-bottom: 2px; }
.kaltag .punkt { width: 5px; height: 5px; border-radius: 50%; background: var(--akzent); }
.kaltag .punkt.fael { background: #f87171; }

/* Tagebuch */
.tbtext {
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px;
  font-family: inherit; margin: 0; color: var(--text);
}
.tbnav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tbnav .datum { flex: 1; text-align: center; font-weight: 700; }
.tbnav button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rand); background: var(--karte); color: var(--text); font-size: 16px; }

/* Formulare */
textarea, input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], select {
  width: 100%; background: var(--karte2); color: var(--text);
  border: 1px solid var(--rand); border-radius: 10px; padding: 11px 12px;
  font-size: 16px; font-family: inherit; margin-bottom: 9px;
  -webkit-appearance: none; appearance: none;
}
textarea { min-height: 92px; resize: vertical; }
label.feld { display: block; font-size: 12.5px; color: var(--leise); margin-bottom: 3px; }
.knopf {
  display: inline-block; width: 100%; padding: 13px; border-radius: 12px;
  border: 0; background: var(--akzent-dunkel); color: #fff; font-size: 16px;
  font-weight: 600; text-align: center;
}
.knopf:active { background: var(--akzent); }
.knopf.zweit { background: var(--karte2); color: var(--text); border: 1px solid var(--rand); }
.knopf[disabled] { opacity: .5; }
.zeile2 { display: flex; gap: 8px; }
.zeile2 > * { flex: 1; }
.check { display: flex; align-items: center; gap: 9px; margin: 4px 0 10px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--akzent); }

/* Sozial */
.balken { height: 8px; background: var(--karte2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.balken .voll { height: 100%; background: var(--akzent); border-radius: 999px; }
.gross { font-size: 22px; font-weight: 700; }
.bilanzzeile { display: flex; gap: 14px; }
.bilanzzeile .wert { text-align: center; flex: 1; }
.bilanzzeile .wert .zahl { font-size: 21px; font-weight: 700; }
.bilanzzeile .wert .label { font-size: 12px; color: var(--leise); }
.stufenzeile { display: flex; gap: 8px; padding: 8px 2px; border-top: 1px solid var(--rand); align-items: baseline; }
.stufenzeile .nr { color: var(--leise); flex: 0 0 20px; }
.stufenzeile.aktivstufe .nr, .stufenzeile.aktivstufe .uebung { color: var(--akzent); font-weight: 600; }
.stufenzeile .waehlen { margin-left: auto; background: none; border: 0; color: var(--leise); font-size: 13px; padding: 0 4px; }
.logzeile { padding: 7px 2px; border-top: 1px solid var(--rand); font-size: 14px; }
.logzeile:first-of-type { border-top: 0; }
.logzeile .kopf { display: flex; gap: 8px; }
.logzeile .kopf .datum { color: var(--leise); }
.logzeile .kopf .zahlen { margin-left: auto; color: var(--akzent); }
.logzeile .notiz { color: var(--leise); font-size: 13px; }
.hinweis { background: var(--karte2); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.hinweis.gruen { border-left: 3px solid var(--ok); }
.werk .tu { margin: 6px 0; }
.werk .warum { color: var(--leise); font-size: 14px; }
.werk .quelle { color: var(--leise); font-size: 12px; margin-top: 6px; font-style: italic; }

/* Training */
.trsaetze { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
.trsatz { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--karte2); border: 1px solid var(--rand); color: var(--ok); font-weight: 600; }

/* Tabbar */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: rgba(31,29,26,.95);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--rand);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; background: none; border: 0; color: var(--leise);
  font-size: 11px; padding: 5px 0 3px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button.aktiv { color: var(--akzent); }

/* FAB */
.fab {
  position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 18px; border: 0; z-index: 25;
  background: var(--akzent-dunkel); color: #fff; font-size: 28px;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); display: none;
  align-items: center; justify-content: center; line-height: 1;
}
.fab.sichtbar { display: flex; }

/* Sheets und Toast */
.schleier {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
  display: none; align-items: flex-end;
}
.schleier.offen { display: flex; }
.sheet {
  background: var(--karte); width: 100%; border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 86vh; overflow-y: auto;
}
.sheet h2 { margin: 0 0 12px; font-size: 17px; }
.sheet .griff { width: 40px; height: 4px; border-radius: 2px; background: var(--rand); margin: 0 auto 12px; }
.sheet .aktion {
  display: block; width: 100%; text-align: left; padding: 13px 12px;
  background: var(--karte2); border: 1px solid var(--rand); color: var(--text);
  border-radius: 12px; margin-bottom: 8px; font-size: 15.5px;
}
.sheet .aktion.rot { color: #f87171; }
.sheet .aktion small { color: var(--leise); display: block; font-size: 12.5px; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(14px + env(safe-area-inset-top)); z-index: 60;
  background: #0f0e0c; color: var(--text); border: 1px solid var(--rand);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 88vw;
  display: none; box-shadow: 0 4px 14px rgba(0,0,0,.5);
}
#toast.rot { border-color: var(--rot); }
#toast.sichtbar { display: block; }

.standzeile { text-align: center; color: var(--leise); font-size: 12px; margin: 4px 0 10px; }
.hilfetext { color: var(--leise); font-size: 13.5px; }
.hilfetext code { background: var(--karte2); padding: 1px 5px; border-radius: 5px; }

.tbedit { min-height: 46vh; font-size: 15px; line-height: 1.5; }

</style>
</head>
<body>
<header>
  <div>
    <div class="titel">Life Dashboard</div>
    <div class="datum" id="kopfdatum"></div>
  </div>
  <div class="frei"></div>
  <button class="kopfknopf" id="syncknopf" data-aktion="sync" aria-label="Aktualisieren">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
  </button>
  <button class="kopfknopf" data-aktion="einstellungen" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>
<main>
  <div class="standzeile" id="standzeile"></div>
  <div class="blatt aktiv" id="blatt-heute"></div>
  <div class="blatt" id="blatt-kalender"></div>
  <div class="blatt" id="blatt-tagebuch"></div>
  <div class="blatt" id="blatt-training"></div>
  <div class="blatt" id="blatt-sozial"></div>
</main>
<button class="fab sichtbar" id="fab" data-aktion="fab" aria-label="Neues Todo">+</button>
<nav class="tabs">
  <button data-aktion="tab" data-tab="heute" class="aktiv">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    Heute
  </button>
  <button data-aktion="tab" data-tab="kalender">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Kalender
  </button>
  <button data-aktion="tab" data-tab="tagebuch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Tagebuch
  </button>
  <button data-aktion="tab" data-tab="training">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
    Training
  </button>
  <button data-aktion="tab" data-tab="sozial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Sozial
  </button>
</nav>
<div class="schleier" id="schleier"><div class="sheet" id="sheetinhalt"></div></div>
<div id="toast"></div>
<script>
// ===CORE-START===
// Dashboard Mobile, Kernlogik. Portiert aus generate.py und aktionen.py.
// Die Schreibformate muessen exakt denen des PC-Dashboards entsprechen,
// deshalb ist jede Funktion eine moeglichst woertliche Uebersetzung.
"use strict";

const WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WOCHENTAG_LANG = ["montags", "dienstags", "mittwochs", "donnerstags",
  "freitags", "samstags", "sonntags"];

const HABIT_LABEL = {
  gym: "Gym", protein: "Protein", kalorien: "Kalorien", supps: "Supplemente",
  lesen: "Lesen", spazieren: "Bewegung", coden: "Coden", haushalt: "Haushalt",
  raus: "Raus", tagebuch: "Tagebuch", schlaf: "Schlaf über 7h",
  abruf: "Abrufübung", sozial: "Soziale Übung",
};

const PRIO_RANK = { hoch: 0, mittel: 1, niedrig: 2, "": 3 };
const PRIO_LABEL = { hoch: "Hoch", mittel: "Mittel", niedrig: "Niedrig", "": "" };

// ------------------------------------------------------------- Datum
// Daten sind Date-Objekte auf Mitternacht UTC, damit Differenzen nie
// an der Sommerzeit scheitern. heute() kommt von der lokalen Uhr.

function schaltjahr(j) { return j % 4 === 0 && (j % 100 !== 0 || j % 400 === 0); }
function monatstage(j, m) {
  return [31, schaltjahr(j) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}
function makeDate(j, m, t) {
  if (m < 1 || m > 12 || t < 1 || t > monatstage(j, m)) return null;
  return new Date(Date.UTC(j, m - 1, t));
}
function heute() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function iso(d) {
  const p = (x) => String(x).padStart(2, "0");
  return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
}
function punktDatum(d) {
  const p = (x) => String(x).padStart(2, "0");
  return d.getUTCFullYear() + "." + p(d.getUTCMonth() + 1) + "." + p(d.getUTCDate());
}
function addDays(d, n) { return new Date(d.getTime() + n * 86400000); }
function weekday(d) { return (d.getUTCDay() + 6) % 7; } // Mo=0
function tageDiff(a, b) { return Math.round((a.getTime() - b.getTime()) / 86400000); }
function gleich(a, b) { return a && b && a.getTime() === b.getTime(); }

function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return makeDate(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})$/);
  if (m) return makeDate(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return makeDate(+m[3], +m[2], +m[1]);
  return null;
}
function parseDateIso(s) {
  const m = String(s || "").trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m ? makeDate(+m[1], +m[2], +m[3]) : null;
}

function plusMonat(d, n) {
  n = n === undefined ? 1 : n;
  const m = d.getUTCMonth() + n;
  const jahr = d.getUTCFullYear() + Math.floor(m / 12);
  const monat = ((m % 12) + 12) % 12 + 1;
  const tage = monatstage(jahr, monat);
  return makeDate(jahr, monat, Math.min(d.getUTCDate(), tage));
}
function plusJahr(d, n) {
  n = n === undefined ? 1 : n;
  const j = d.getUTCFullYear() + n;
  return makeDate(j, d.getUTCMonth() + 1, d.getUTCDate())
    || makeDate(j, d.getUTCMonth() + 1, 28); // 29. Februar
}

// ISO-Kalenderwoche wie Python date.isocalendar(): [jahr, woche]
function isoWoche(d) {
  const do4 = addDays(d, 3 - weekday(d)); // Donnerstag der Woche
  const jahr = do4.getUTCFullYear();
  const jan1 = makeDate(jahr, 1, 1);
  const woche = Math.floor(tageDiff(do4, jan1) / 7) + 1;
  return [jahr, woche];
}

function tageHer(d) {
  if (!d) return "";
  const n = tageDiff(heute(), d);
  if (n === 0) return "heute";
  if (n === 1) return "gestern";
  if (n < 0) return "in " + Math.abs(n) + " Tagen";
  return "vor " + n + " Tagen";
}

function faelligText(d) {
  if (!d) return "";
  const n = tageDiff(d, heute());
  if (n < 0) return Math.abs(n) + " Tage überfällig";
  if (n === 0) return "heute fällig";
  if (n === 1) return "morgen";
  return "in " + n + " Tagen";
}

const WIEDER = {
  morgen: ["morgen", () => addDays(heute(), 1)],
  woche: ["nächste Woche", () => addDays(heute(), 7)],
  monat: ["nächsten Monat", () => plusMonat(heute())],
  jahr: ["nächstes Jahr", () => plusJahr(heute())],
};
const VERSCHIEBEN = {
  morgen: ["morgen", () => addDays(heute(), 1)],
  woche: ["nächste Woche", () => addDays(heute(), 7)],
};

// ------------------------------------------------------- Text-Hilfen

function stripChars(s, chars) {
  let a = 0, b = s.length;
  while (a < b && chars.includes(s[a])) a++;
  while (b > a && chars.includes(s[b - 1])) b--;
  return s.slice(a, b);
}
function rstripNl(s) { return s.replace(/\n+$/, ""); }
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; }
function titleCase(s) {
  return s.replace(/[A-Za-zÀ-ÿÄÖÜäöüß]+/g, (w) => w[0].toUpperCase() + w.slice(1).toLowerCase());
}
function joinZeilen(zeilen) { return rstripNl(zeilen.join("\n")) + "\n"; }

// Python liest Dateien mit Universal Newlines, \r\n wird zu \n.
// Alle Kernfunktionen normalisieren ihre Texteingabe genauso.
function nl(text) { return String(text == null ? "" : text).replace(/\r\n?/g, "\n"); }

// Wie Python splitlines(): der Umbruch am Dateiende erzeugt keine leere
// Schlusszeile. Alle Schreibfunktionen arbeiten auf diesen Zeilen.
function zeilenAus(text) {
  const z = nl(text).split("\n");
  if (z.length && z[z.length - 1] === "") z.pop();
  return z;
}

// Zeilen ohne Codebloecke, Kommentare, Ueberschriften und Tabellen.
// Woertlich aus generate.datenzeilen, gleiche Grenzen, gleiche Luecken.
function datenzeilen(text) {
  const raus = [];
  let fence = false;
  for (const line of nl(text).split("\n")) {
    const s = line.trim();
    if (s.startsWith("```")) { fence = !fence; continue; }
    if (fence || !s) continue;
    if (s.startsWith("#") || s.startsWith("<!--") || s.startsWith("|") || s.startsWith(">")) continue;
    raus.push(line);
  }
  return raus;
}

// Konfigdatei als {Ueberschrift: [zeilen]}, ohne Codebloecke, mit
// mehrzeiligen Kommentaren. Woertlich aus aktionen._abschnitte.
function abschnitte(text) {
  const raus = {};
  let aktuell = null, fence = false, komm = false;
  for (const zeile of nl(text).split("\n")) {
    const s = zeile.trim();
    if (s.startsWith("```")) { fence = !fence; continue; }
    if (komm) { if (s.includes("-->")) komm = false; continue; }
    if (s.startsWith("<!--")) { if (!s.includes("-->")) komm = true; continue; }
    if (fence || !s) continue;
    if (s.startsWith("## ")) { aktuell = s.slice(3).trim(); raus[aktuell] = []; continue; }
    if (s.startsWith("#") || s === "---") continue;
    if (aktuell) raus[aktuell].push(s);
  }
  return raus;
}

// --------------------------------------------------------------- Todos

const TODO_RE = /^\s*[-*]\s*\[([ xX])\]\s*(.+?)\s*$/;
const TAG_RE = /#([A-Za-zÄÖÜäöüß0-9_-]+)/g;
const DUE_RE = /@(\d{4}-\d{2}-\d{2})/;
const DUE_RE_G = /@(\d{4}-\d{2}-\d{2})/g;
const PRIO_RE = /!(hoch|mittel|niedrig)(?![\p{L}\p{N}_])/iu;
const PRIO_RE_G = /!(hoch|mittel|niedrig)(?![\p{L}\p{N}_])/giu;
const H2_RE = /^##\s+(.+?)\s*$/;

function listenName(datei) {
  const n = datei.replace(/\.md$/, "");
  return n === "Todos" ? "Persönlich" : n.replace("Todos - ", "");
}

function todoClean(raw) {
  let clean = raw.replace(TAG_RE, "").replace(DUE_RE_G, "").replace(PRIO_RE_G, "");
  clean = clean.replace(/\s{2,}/g, " ");
  return stripChars(clean, " -");
}

// dateien: [{datei, text}] in der Reihenfolge Todos.md zuerst, Rest sortiert.
function parseTodos(dateien) {
  const todos = [];
  for (const { datei, text } of dateien) {
    let sektion = "Ohne Sektion", fence = false;
    for (const line of nl(text).split("\n")) {
      const s = line.trim();
      if (s.startsWith("```")) { fence = !fence; continue; }
      if (fence) continue;
      const h = line.match(H2_RE);
      if (h) { sektion = h[1]; continue; }
      const m = line.match(TODO_RE);
      if (!m) continue;
      const raw = m[2];
      const tags = Array.from(raw.matchAll(TAG_RE), (x) => x[1].toLowerCase());
      const dueM = raw.match(DUE_RE);
      const prioM = raw.match(PRIO_RE);
      const clean = todoClean(raw);
      if (!clean) continue;
      todos.push({
        text: clean,
        done: m[1].toLowerCase() === "x",
        tags,
        due: dueM ? parseDate(dueM[1]) : null,
        prio: prioM ? prioM[1].toLowerCase() : "",
        datei,
        liste: listenName(datei),
        sektion,
        raw: line.replace(/\n+$/, ""),
      });
    }
  }
  return todos;
}

function todoListen(dateien) {
  const listen = [];
  for (const { datei, text } of dateien) {
    const sektionen = [];
    let fence = false;
    for (const line of nl(text).split("\n")) {
      if (line.trim().startsWith("```")) { fence = !fence; continue; }
      if (fence) continue;
      const h = line.match(H2_RE);
      if (h) sektionen.push(h[1]);
    }
    if (sektionen.length) listen.push({ datei, liste: listenName(datei), sektionen });
  }
  return listen;
}

function todoZeile(text, prio, due) {
  let line = "- [ ] " + text.trim();
  if (due) line += " @" + due;
  if (prio) line += " !" + prio;
  return line;
}

// Haengt eine neue ## Sektion ans Ende. Gibt {text, name} zurueck.
function sektionAnlegen(text, name) {
  name = (name || "").trim();
  if (!name) throw new Error("Leerer Kategoriename");
  if (name.length > 60) throw new Error("Kategoriename zu lang");
  if (name.includes("\n") || name.startsWith("#")) throw new Error("Ungueltiger Kategoriename");
  let fence = false;
  for (const line of nl(text).split("\n")) {
    if (line.trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    const h = line.match(H2_RE);
    if (h && h[1].toLowerCase() === name.toLowerCase()) return { text: nl(text), name: h[1] };
  }
  return { text: nl(text) + "\n## " + name + "\n", name };
}

// Haengt ein Todo unter die passende ## Sektion. Gibt {text, neu} zurueck.
function todoAnlegen(text, sektion, todoText, prio, due) {
  if (!todoText.trim()) throw new Error("Leeres Todo");
  if (due && !parseDate(due)) throw new Error("Ungueltiges Datum: " + due);
  if (prio && !["hoch", "mittel", "niedrig"].includes(prio)) throw new Error("Ungueltige Prioritaet: " + prio);
  const zeilen = zeilenAus(text);
  let start = null;
  for (let i = 0; i < zeilen.length; i++) {
    const h = zeilen[i].match(H2_RE);
    if (h && h[1] === sektion) { start = i; break; }
  }
  if (start === null) throw new Error("Sektion gibt es nicht: " + sektion);
  let ende = zeilen.length;
  for (let i = start + 1; i < zeilen.length; i++) {
    if (H2_RE.test(zeilen[i]) || zeilen[i].startsWith("# ")) { ende = i; break; }
  }
  let einfuegen = start + 1;
  for (let i = start + 1; i < ende; i++) {
    if (TODO_RE.test(zeilen[i])) einfuegen = i + 1;
  }
  const neu = todoZeile(todoText, prio, due);
  if (einfuegen === start + 1) {
    zeilen.splice(einfuegen, 0, "", neu);
  } else {
    zeilen.splice(einfuegen, 0, neu);
  }
  return { text: joinZeilen(zeilen), neu };
}

const ERLEDIGT_KOPF = "# Erledigt\n\nArchiv des Dashboards.\n\n---\n";

// Nimmt die Zeile raus und haengt sie an Erledigt.md. Gibt
// {todosText, erledigtText, neu, wiederText} zurueck. wiederText ist der
// Todos-Text NACH dem Wiederanlegen (nur bei wieder gesetzt), sonst null.
function todoArchivieren(todosText, erledigtText, datei, raw, wieder) {
  if (wieder && !(wieder in WIEDER)) throw new Error("Unbekannte Wiedervorlage: " + wieder);
  const zeilen = zeilenAus(todosText);
  let treffer = null, sektion = "Ohne Sektion", letzteSektion = sektion;
  for (let i = 0; i < zeilen.length; i++) {
    const h = zeilen[i].match(H2_RE);
    if (h) letzteSektion = h[1];
    if (rstripNl(zeilen[i]) === raw) {
      if (!TODO_RE.test(zeilen[i])) throw new Error("Keine Todo-Zeile");
      treffer = i; sektion = letzteSektion; break;
    }
  }
  if (treffer === null) throw new Error("Zeile nicht gefunden");

  const m = zeilen[treffer].match(TODO_RE);
  const text = m[2];
  zeilen.splice(treffer, 1);
  if (treffer > 0 && treffer < zeilen.length && !zeilen[treffer].trim()
      && !zeilen[treffer - 1].trim()) {
    zeilen.splice(treffer, 1);
  }
  let neuTodos = joinZeilen(zeilen);

  const heuteStr = iso(heute());
  const monat = heuteStr.slice(0, 7);
  const neu = "- [x] " + text + " | " + listenName(datei) + " / " + sektion
    + " | erledigt " + heuteStr;

  let atext = erledigtText;
  if (!atext) atext = ERLEDIGT_KOPF;
  const azeilen = zeilenAus(atext);
  const echt = [];
  let fence = false;
  for (let i = 0; i < azeilen.length; i++) {
    if (azeilen[i].trim().startsWith("```")) { fence = !fence; continue; }
    if (!fence) echt.push(i);
  }
  let kopf = null;
  for (const i of echt) {
    const h = azeilen[i].match(H2_RE);
    if (h && h[1] === monat) { kopf = i; break; }
  }
  if (kopf === null) {
    let anker = azeilen.length;
    for (const i of echt) {
      if (azeilen[i].trim() === "---") { anker = i + 1; break; }
    }
    azeilen.splice(anker, 0, "", "## " + monat, "", neu);
  } else {
    azeilen.splice(kopf + 2, 0, neu);
  }
  const neuErledigt = joinZeilen(azeilen);

  let wiederText = null;
  if (wieder) {
    const neuesDatum = WIEDER[wieder][1]();
    let basis = text.replace(DUE_RE_G, "");
    basis = basis.replace(/\s{2,}/g, " ").trim();
    const prioM = basis.match(PRIO_RE);
    const prio = prioM ? prioM[1].toLowerCase() : "";
    basis = basis.replace(PRIO_RE_G, "");
    basis = basis.replace(/\s{2,}/g, " ").trim();
    wiederText = todoAnlegen(neuTodos, sektion, basis, prio, iso(neuesDatum)).text;
  }
  return { todosText: neuTodos, erledigtText: neuErledigt, neu, wiederText };
}

// Setzt nur das Faelligkeitsdatum neu. Gibt {text, zeile} zurueck.
function todoVerschieben(text, raw, wann) {
  if (!(wann in VERSCHIEBEN)) throw new Error("Unbekanntes Ziel: " + wann);
  const zeilen = zeilenAus(text);
  const neues = iso(VERSCHIEBEN[wann][1]());
  for (let i = 0; i < zeilen.length; i++) {
    if (rstripNl(zeilen[i]) !== raw) continue;
    const m = zeilen[i].match(TODO_RE);
    if (!m) throw new Error("Keine Todo-Zeile");
    let t = m[2];
    if (DUE_RE.test(t)) {
      t = t.replace(DUE_RE, "@" + neues);
    } else {
      const pm = t.match(PRIO_RE);
      if (pm) {
        t = t.slice(0, pm.index).replace(/\s+$/, "") + " @" + neues + " " + t.slice(pm.index);
      } else {
        t = t.replace(/\s+$/, "") + " @" + neues;
      }
    }
    t = t.replace(/\s{2,}/g, " ").trim();
    zeilen[i] = "- [" + m[1] + "] " + t;
    return { text: joinZeilen(zeilen), zeile: zeilen[i] };
  }
  throw new Error("Zeile nicht gefunden");
}

function todoUmschalten(text, raw) {
  const zeilen = zeilenAus(text);
  for (let i = 0; i < zeilen.length; i++) {
    if (rstripNl(zeilen[i]) === raw) {
      const m = zeilen[i].match(TODO_RE);
      if (!m) throw new Error("Keine Todo-Zeile");
      const neu = m[1] === " " ? "x" : " ";
      zeilen[i] = zeilen[i].replace(/\[[ xX]\]/, "[" + neu + "]");
      return { text: joinZeilen(zeilen), zeile: zeilen[i] };
    }
  }
  throw new Error("Zeile nicht gefunden");
}

// ------------------------------------------------------------ Erledigt

const ARCHIV_RE = /^\s*[-*]\s*\[[xX]\]\s*(.+?)\s*\|\s*([^|]+?)\s*\|\s*erledigt\s+(\d{4}-\d{2}-\d{2})\s*$/;

function parseErledigt(text) {
  const eintraege = [];
  let fence = false;
  for (const line of nl(text).split("\n")) {
    if (line.trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    const m = line.match(ARCHIV_RE);
    if (!m) continue;
    const d = parseDate(m[3]);
    if (!d) continue;
    eintraege.push({ text: todoClean(m[1]), herkunft: m[2].trim(), datum: d });
  }
  eintraege.sort((a, b) => b.datum - a.datum);
  return eintraege;
}

// ------------------------------------------------------------ Kalender

const KAL_RE = /^\s*(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?\s*(\*)?\s*\|\s*([^|]+?)(?:\s*\|\s*(.+?))?\s*$/;

function parseKalender(text) {
  const termine = [];
  for (const line of datenzeilen(text)) {
    const m = line.match(KAL_RE);
    if (!m) continue;
    let d = parseDate(m[1]);
    if (!d) continue;
    if (m[3]) {
      d = makeDate(heute().getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
      if (!d) continue;
      if (d < heute()) d = makeDate(heute().getUTCFullYear() + 1, d.getUTCMonth() + 1, d.getUTCDate());
      if (!d) continue;
    }
    termine.push({
      datum: d, zeit: m[2] || "", titel: m[4].trim(),
      notiz: (m[5] || "").trim(), jaehrlich: !!m[3],
    });
  }
  termine.sort((a, b) => (a.datum - b.datum) || ((a.zeit || "99:99") < (b.zeit || "99:99") ? -1 : (a.zeit || "99:99") > (b.zeit || "99:99") ? 1 : 0));
  return termine;
}

// Traegt einen Termin unter ## Termine ein. Gibt {text, neu} zurueck.
function kalenderAnlegen(text, datum, titel, zeit, notiz) {
  const d = typeof datum === "string" ? parseDate(datum) : datum;
  if (!d) throw new Error("Ungueltiges Datum: " + datum);
  titel = (titel || "").trim().replace(/\|/g, "/");
  if (!titel) throw new Error("Leerer Termin");
  if (zeit) {
    const m = zeit.match(/^(\d{1,2}):(\d{2})$/);
    if (!m || +m[1] > 23 || +m[2] > 59) throw new Error("Ungueltige Zeit: " + zeit);
  }
  let neu = iso(d);
  if (zeit) neu += " " + zeit;
  neu += " | " + titel;
  if (notiz) neu += " | " + notiz.trim().replace(/\|/g, "/");

  const zeilen = zeilenAus(text);
  if (zeilen.includes(neu)) return { text: joinZeilen(zeilen), neu, unveraendert: true };

  let start = null, fence = false;
  for (let i = 0; i < zeilen.length; i++) {
    if (zeilen[i].trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    const h = zeilen[i].match(H2_RE);
    if (h && h[1] === "Termine") { start = i; break; }
  }
  if (start === null) {
    const z2 = zeilen.concat(["", "## Termine", "", neu]);
    return { text: joinZeilen(z2), neu };
  }
  let ende = zeilen.length;
  for (let i = start + 1; i < zeilen.length; i++) {
    if (H2_RE.test(zeilen[i]) || zeilen[i].startsWith("# ")) { ende = i; break; }
  }
  let einfuegen = null, letzte = start + 1;
  for (let i = start + 1; i < ende; i++) {
    const m = zeilen[i].match(KAL_RE);
    if (!m) continue;
    letzte = i + 1;
    const vorhanden = parseDate(m[1]);
    if (vorhanden && vorhanden > d && einfuegen === null) einfuegen = i;
  }
  if (einfuegen === null) {
    einfuegen = letzte;
    if (einfuegen === start + 1) {
      zeilen.splice(einfuegen, 0, "");
      einfuegen += 1;
    }
  }
  zeilen.splice(einfuegen, 0, neu);
  return { text: joinZeilen(zeilen), neu };
}

function terminFinden(text, datum, titel) {
  const zeilen = zeilenAus(text);
  const d = typeof datum === "string" ? parseDate(datum) : datum;
  let fence = false;
  for (let i = 0; i < zeilen.length; i++) {
    if (zeilen[i].trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    const m = zeilen[i].match(KAL_RE);
    if (m && gleich(parseDate(m[1]), d) && m[4].trim() === titel.trim()) {
      return { zeilen, i, m };
    }
  }
  return { zeilen, i: null, m: null };
}

function terminLoeschen(text, datum, titel) {
  const { zeilen, i } = terminFinden(text, datum, titel);
  if (i === null) throw new Error("Termin nicht gefunden");
  const weg = zeilen.splice(i, 1)[0];
  return { text: joinZeilen(zeilen), weg };
}

function terminVerschieben(text, datum, titel, wann) {
  if (!(wann in VERSCHIEBEN)) throw new Error("Unbekanntes Ziel: " + wann);
  const { zeilen, i, m } = terminFinden(text, datum, titel);
  if (i === null) throw new Error("Termin nicht gefunden");
  const zeit = m[2] || "", notiz = m[5] || "";
  zeilen.splice(i, 1);
  const zwischen = joinZeilen(zeilen);
  return kalenderAnlegen(zwischen, iso(VERSCHIEBEN[wann][1]()), titel, zeit, notiz);
}

// -------------------------------------------------------------- Habits

const HABIT_RE = /^\s*(\d{4}-\d{2}-\d{2})\s*\|\s*(.+?)\s*$/;

function parseHabits(text) {
  const log = {};
  for (const line of datenzeilen(text)) {
    const m = line.match(HABIT_RE);
    if (!m) continue;
    const d = parseDate(m[1]);
    if (!d) continue;
    log[iso(d)] = m[2].split(/[\s,]+/).filter(Boolean).map((h) => h.toLowerCase());
  }
  return log;
}

function streak(log, habit) {
  let n = 0, d = heute();
  if (!(log[iso(d)] || []).includes(habit)) d = addDays(d, -1);
  while ((log[iso(d)] || []).includes(habit)) { n += 1; d = addDays(d, -1); }
  return n;
}

// Setzt oder entfernt ein Habit fuer den Tag. Gibt {text, aktuell} zurueck.
function habitSetzen(text, habit, an, tagIso) {
  habit = (habit || "").trim().toLowerCase();
  if (!/^[a-zäöüß0-9_-]{1,24}$/.test(habit)) throw new Error("Ungueltiges Habit: " + habit);
  const zeilen = zeilenAus(text);
  const datum = tagIso || iso(heute());
  let fence = false, treffer = null;
  for (let i = 0; i < zeilen.length; i++) {
    if (zeilen[i].trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    const m = zeilen[i].match(HABIT_RE);
    if (m && m[1] === datum) { treffer = i; break; }
  }
  let aktuell = [];
  if (treffer !== null) {
    aktuell = zeilen[treffer].match(HABIT_RE)[2].split(/[\s,]+/).filter(Boolean);
  }
  if (an && !aktuell.includes(habit)) aktuell.push(habit);
  else if (!an && aktuell.includes(habit)) aktuell.splice(aktuell.indexOf(habit), 1);

  const neu = datum + " | " + aktuell.join(" ");
  if (treffer !== null) {
    if (aktuell.length) zeilen[treffer] = neu;
    else zeilen.splice(treffer, 1);
  } else if (aktuell.length) {
    zeilen.push(neu);
  }
  return { text: joinZeilen(zeilen), aktuell };
}

// ----------------------------------------------------------- Schichten

function parseSchichten(text) {
  const ab = abschnitte(text);
  if (!Object.keys(ab).length) return null;

  const arten = {};
  for (const z of ab["Definition"] || []) {
    const teile = z.split("|").map((x) => x.trim());
    if (teile.length < 3) continue;
    const kuerzel = teile[0].toLowerCase();
    if (!/^[a-z0-9_-]{1,16}$/.test(kuerzel)) continue;
    arten[kuerzel] = {
      von: teile[1], bis: teile[2],
      name: teile.length > 3 ? teile[3] : titleCase(kuerzel),
    };
  }
  if (!Object.keys(arten).length) return null;

  const rotation = [];
  for (const z of ab["Rotation"] || []) {
    for (const x of z.split(/\s+/)) {
      if (x.toLowerCase() in arten) rotation.push(x.toLowerCase());
    }
  }
  if (!rotation.length) return null;

  let anker = null;
  for (const z of ab["Anker"] || []) {
    const teile = z.split("|").map((x) => x.trim());
    if (teile.length !== 2) continue;
    const d = parseDateIso(teile[0]);
    if (d && rotation.includes(teile[1].toLowerCase())) {
      anker = { montag: addDays(d, -weekday(d)), schicht: teile[1].toLowerCase() };
      break;
    }
  }
  if (!anker) return null;

  const tage = new Set();
  for (const z of ab["Arbeitstage"] || []) {
    const teile = z.replace(/,/g, " ").split(/\s+/).filter(Boolean);
    if (!teile.length || !teile.every((x) => WOCHENTAGE.includes(capitalize(x)))) continue;
    for (const x of teile) tage.add(WOCHENTAGE.indexOf(capitalize(x)));
  }
  if (!tage.size) [0, 1, 2, 3, 4].forEach((t) => tage.add(t));

  const ausnahmen = {};
  for (const z of ab["Ausnahmen"] || []) {
    const teile = z.split("|").map((x) => x.trim());
    if (teile.length !== 2) continue;
    const d = parseDateIso(teile[0]);
    if (d && (teile[1].toLowerCase() in arten || teile[1].toLowerCase() === "frei")) {
      ausnahmen[iso(d)] = teile[1].toLowerCase();
    }
  }
  return { arten, rotation, anker, tage, ausnahmen };
}

function schichtAm(tag, cfg) {
  if (!cfg) return null;
  const key = iso(tag);
  if (key in cfg.ausnahmen) {
    const k = cfg.ausnahmen[key];
    if (k === "frei") return null;
    return Object.assign({}, cfg.arten[k], { kuerzel: k });
  }
  if (!cfg.tage.has(weekday(tag))) return null;
  const montag = addDays(tag, -weekday(tag));
  const wochen = Math.floor(tageDiff(montag, cfg.anker.montag) / 7);
  const start = cfg.rotation.indexOf(cfg.anker.schicht);
  const n = cfg.rotation.length;
  const k = cfg.rotation[(((start + wochen) % n) + n) % n];
  return Object.assign({}, cfg.arten[k], { kuerzel: k });
}

// ---------------------------------------------------------- Gesundheit

const GES_LOG_RE = /^\s*(\d{4}-\d{2}-\d{2})\s*\|(.*)$/;

function gesFelderLesen(zeile) {
  const felder = {};
  for (const teil of zeile.split("|").slice(1)) {
    const toks = teil.split(/\s+/).filter(Boolean);
    if (!toks.length) continue;
    const k = toks[0].toLowerCase();
    const v = toks.slice(1).join(" ");
    if (k === "supp") felder.supp = v.split(/[\s,]+/).filter(Boolean);
    else if (["gewicht", "protein", "wasser"].includes(k)) felder[k] = v;
  }
  return felder;
}

function gesZeileBauen(datum, felder) {
  const teile = [datum];
  for (const k of ["gewicht", "protein", "wasser"]) {
    if (felder[k]) teile.push(k + " " + felder[k]);
  }
  if (felder.supp && felder.supp.length) teile.push("supp " + felder.supp.join(","));
  return teile.join(" | ");
}

function gesTagzeile(text, tagIso) {
  const zeilen = zeilenAus(text);
  let logI = null;
  for (let i = 0; i < zeilen.length; i++) {
    if (zeilen[i].trim().toLowerCase() === "## log") { logI = i; break; }
  }
  if (logI === null) {
    if (zeilen.length && zeilen[zeilen.length - 1].trim()) zeilen.push("");
    zeilen.push("## Log");
    logI = zeilen.length - 1;
  }
  let treffer = null;
  for (let i = logI + 1; i < zeilen.length; i++) {
    if (zeilen[i].trim().startsWith("## ")) break;
    const m = zeilen[i].match(GES_LOG_RE);
    if (m && m[1] === tagIso) { treffer = i; break; }
  }
  const felder = treffer !== null ? gesFelderLesen(zeilen[treffer]) : {};
  return { zeilen, logI, treffer, felder };
}

function gesSpeichern(text, tagIso, felder) {
  const { zeilen, treffer } = gesTagzeile(text, tagIso);
  if (!Object.keys(felder).length) {
    if (treffer !== null) zeilen.splice(treffer, 1);
  } else {
    const neu = gesZeileBauen(tagIso, felder);
    if (treffer !== null) zeilen[treffer] = neu;
    else zeilen.push(neu);
  }
  return joinZeilen(zeilen);
}

function fmtG(x) {
  // Python "%g" % round(x, 1)
  const v = Math.round(x * 10) / 10;
  return String(v);
}

function gesundheitLog(text, feld, wert, modus, tagIso) {
  tagIso = tagIso || iso(heute());
  if (!["gewicht", "protein", "wasser"].includes(feld)) throw new Error("Unbekanntes Feld: " + feld);
  const { felder } = gesTagzeile(text, tagIso);
  let w = parseFloat(String(wert).replace(",", "."));
  if (!isFinite(w)) throw new Error("Keine Zahl: " + wert);
  if (modus === "add") w += parseFloat(felder[feld] || 0) || 0;
  if (w <= 0) delete felder[feld];
  else felder[feld] = fmtG(w);
  return { text: gesSpeichern(text, tagIso, felder), felder };
}

function gesundheitSupp(text, kuerzel, an, tagIso) {
  tagIso = tagIso || iso(heute());
  kuerzel = (kuerzel || "").trim().toLowerCase();
  if (!/^[a-zäöüß0-9_-]{1,24}$/.test(kuerzel)) throw new Error("Ungueltiges Supplement: " + kuerzel);
  const { felder } = gesTagzeile(text, tagIso);
  const supp = felder.supp || [];
  if (an && !supp.includes(kuerzel)) supp.push(kuerzel);
  else if (!an && supp.includes(kuerzel)) supp.splice(supp.indexOf(kuerzel), 1);
  if (supp.length) felder.supp = supp;
  else delete felder.supp;
  return { text: gesSpeichern(text, tagIso, felder), supp };
}

function norm(s) {
  return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function suppRhythmus(text) {
  const t = norm(text);
  if (!t) return ["taeglich", []];
  if (t.startsWith("bedarf") || t.startsWith("nach bedarf")
      || t.startsWith("optional") || t.startsWith("wenn")) return ["bedarf", []];
  const tage = [];
  for (let w of t.split(/\s+/)) {
    w = capitalize(w.slice(0, 2));
    if (WOCHENTAGE.includes(w) && !tage.includes(WOCHENTAGE.indexOf(w))) {
      tage.push(WOCHENTAGE.indexOf(w));
    }
  }
  if (tage.length) return ["wochentag", tage.sort((a, b) => a - b)];
  return ["taeglich", []];
}

function suppFaellig(s, tag) {
  tag = tag || heute();
  if (s.art === "wochentag") return s.tage.includes(weekday(tag));
  return s.art === "taeglich";
}

function suppWann(s) {
  if (s.notiz) return s.notiz;
  if (s.art === "bedarf") return "bei Bedarf";
  if (s.art === "wochentag") {
    if (s.tage.length === 1) return WOCHENTAG_LANG[s.tage[0]];
    return s.tage.map((i) => WOCHENTAGE[i]).join(", ");
  }
  return "täglich";
}

function parseGesundheit(text) {
  const ab = abschnitte(text);
  const supp = [];
  for (const z of ab["Supplemente"] || []) {
    const teile = z.split("|").map((x) => x.trim());
    const key = teile[0].toLowerCase();
    if (!key) continue;
    const label = teile.length > 1 && teile[1] ? teile[1] : titleCase(teile[0]);
    const [art, tage] = suppRhythmus(teile.length > 2 ? teile[2] : "");
    supp.push({ key, label, art, tage, notiz: teile.length > 3 ? teile[3] : "" });
  }
  const ziele = {};
  for (const z of ab["Ziele"] || []) {
    if (z.includes("|")) {
      const idx = z.indexOf("|");
      const k = z.slice(0, idx), v = z.slice(idx + 1);
      const f = parseFloat(v.trim().replace(",", "."));
      if (isFinite(f)) ziele[k.trim().toLowerCase()] = f;
    }
  }
  const log = {};
  for (const z of ab["Log"] || []) {
    const m = z.match(GES_LOG_RE);
    if (m) log[m[1]] = gesFelderLesen(z);
  }
  return { supplemente: supp, ziele, log };
}

function parseSozial(text) {
  const stufen = [], log = [], reflexionen = [];
  const einst = {};
  let plan = "";
  let abschnitt = null, refl = null, fence = false, komm = false;

  for (const zeile of nl(text).split("\n")) {
    const s = zeile.trim();
    if (s.startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    if (komm) { if (s.includes("-->")) komm = false; continue; }
    if (s.startsWith("<!--")) { if (!s.includes("-->")) komm = true; continue; }
    if (s.startsWith("## ")) { abschnitt = s.slice(3).trim().toLowerCase(); refl = null; continue; }
    if (abschnitt === "reflexionen") {
      if (s.startsWith("### ")) {
        refl = { datum: s.slice(4).trim(), zeilen: [] };
        reflexionen.push(refl);
        continue;
      }
      if (refl !== null && s) refl.zeilen.push(s);
      continue;
    }
    if (s.startsWith("#") || s === "---" || !s) continue;

    if (abschnitt === "stufen") {
      const m = s.match(SOZIAL_STUFE_RE);
      if (m) stufen.push({ stufe: +m[1], kuerzel: m[2].toLowerCase(),
        uebung: m[3].trim(), hinweis: (m[4] || "").trim() });
    } else if (abschnitt === "einstellungen") {
      if (s.includes("|")) {
        const idx = s.indexOf("|");
        const k = s.slice(0, idx).trim().toLowerCase();
        const v = parseInt(s.slice(idx + 1).trim(), 10);
        if (Number.isFinite(v) && /^[+-]?\d+$/.test(s.slice(idx + 1).trim())) einst[k] = v;
      }
    } else if (abschnitt === "plan") {
      if (!plan) plan = s;
    } else if (abschnitt === "log") {
      const m = s.match(SOZIAL_LOG_RE);
      if (m) {
        const d = parseDateIso(m[1]);
        if (d === null) continue;
        const zahl = (x) => {
          if (x === "-") return null;
          const n = parseInt(x, 10);
          return n >= 0 && n <= 10 ? n : null;
        };
        log.push({ datum: d, kuerzel: m[2].toLowerCase(),
          vorher: zahl(m[3]), nachher: zahl(m[4]), notiz: (m[5] || "").trim() });
      }
    }
  }
  for (const r of reflexionen) {
    r.text = r.zeilen.join("\n").trim();
    delete r.zeilen;
  }
  stufen.sort((a, b) => a.stufe - b.stufe);
  const nummern = stufen.map((x) => x.stufe);
  let stufe = "stufe" in einst ? einst.stufe : (nummern.length ? nummern[0] : 1);
  if (nummern.length && !nummern.includes(stufe)) {
    stufe = nummern.reduce((best, n) =>
      Math.abs(n - stufe) < Math.abs(best - stufe) ? n : best, nummern[0]);
  }
  log.sort((a, b) => a.datum - b.datum);
  return { stufen, stufe,
    wochenziel: Math.max(1, Math.min(7, "wochenziel" in einst ? einst.wochenziel : 5)),
    plan, log, reflexionen };
}

function sektionIndex(zeilen, name) {
  let fence = false;
  for (let i = 0; i < zeilen.length; i++) {
    if (zeilen[i].trim().startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    if (zeilen[i].trim().toLowerCase() === ("## " + name).toLowerCase()) return i;
  }
  return null;
}

function sektionEnde(zeilen, start) {
  let fence = false;
  for (let i = start + 1; i < zeilen.length; i++) {
    const s = zeilen[i].trim();
    if (s.startsWith("```")) { fence = !fence; continue; }
    if (fence) continue;
    if (s.startsWith("## ") || s.startsWith("# ")) return i;
  }
  return zeilen.length;
}

function sektionSichern(zeilen, name) {
  const i = sektionIndex(zeilen, name);
  if (i !== null) return i;
  if (zeilen.length && zeilen[zeilen.length - 1].trim()) zeilen.push("");
  zeilen.push("## " + name);
  return zeilen.length - 1;
}

function zeileEinsortieren(zeilen, sektion, neu, trefferRe, schluessel) {
  const i = sektionSichern(zeilen, sektion);
  const ende = sektionEnde(zeilen, i);
  for (let j = i + 1; j < ende; j++) {
    const m = zeilen[j].match(trefferRe);
    if (m && m[1] === schluessel) { zeilen[j] = neu; return zeilen; }
  }
  let einfuegen = ende;
  while (einfuegen > i + 1 && !zeilen[einfuegen - 1].trim()) einfuegen -= 1;
  if (einfuegen === i + 1) { zeilen.splice(einfuegen, 0, ""); einfuegen += 1; }
  zeilen.splice(einfuegen, 0, neu);
  return zeilen;
}

function sozialZeilen(text) {
  let zeilen = text ? zeilenAus(text) : [];
  if (!zeilen.length || (zeilen.length === 1 && !zeilen[0])) {
    zeilen = ["# Sozial", "", "---", "", "## Stufen", "",
      "## Einstellungen", "", "## Plan", "", "## Log", "", "## Reflexionen"];
  }
  return zeilen;
}

function sozialAnhaengen(zeilen, sektion, neu) {
  const i = sektionSichern(zeilen, sektion);
  let ende = sektionEnde(zeilen, i);
  while (ende > i + 1 && !zeilen[ende - 1].trim()) ende -= 1;
  if (ende === i + 1) { zeilen.splice(ende, 0, ""); ende += 1; }
  for (let n = 0; n < neu.length; n++) zeilen.splice(ende + n, 0, neu[n]);
  return zeilen;
}

// Gibt {text, zeile} zurueck. Das Habit sozial setzt der Aufrufer extra.
function sozialLog(text, kuerzel, vorher, nachher, notiz, tagIso, bekannt) {
  const tag = tagIso ? parseDateIso(tagIso) : heute();
  if (tag > heute()) throw new Error("In der Zukunft geuebt wird nicht.");
  kuerzel = (kuerzel || "").trim().toLowerCase();
  if (!bekannt.has(kuerzel)) throw new Error("Unbekannte Uebung: " + kuerzel);
  const zahl = (x) => {
    if (x === "" || x === "-" || x === null || x === undefined) return "-";
    const s = String(x).trim();
    if (!/^[+-]?\d+$/.test(s)) throw new Error("Keine Zahl von 0 bis 10: " + x);
    const n = parseInt(s, 10);
    if (n < 0 || n > 10) throw new Error("Nur 0 bis 10, nicht " + n);
    return String(n);
  };
  notiz = (notiz || "").split(/\s+/).filter(Boolean).join(" ");
  const zeile = iso(tag) + " | " + kuerzel + " | " + zahl(vorher) + " | "
    + zahl(nachher) + (notiz ? " | " + notiz : "");
  const zeilen = sozialZeilen(text);
  sozialAnhaengen(zeilen, "Log", [zeile]);
  return { text: joinZeilen(zeilen), zeile };
}

function sozialStufeSetzen(text, stufe, nummern) {
  stufe = parseInt(stufe, 10);
  if (!Number.isFinite(stufe)) throw new Error("Keine Stufe: " + stufe);
  if (nummern.length && !nummern.includes(stufe)) throw new Error("Diese Stufe gibt es nicht: " + stufe);
  const zeilen = sozialZeilen(text);
  const neu = "stufe | " + stufe;
  zeileEinsortieren(zeilen, "Einstellungen", neu, /^\s*(stufe)\s*\|/, "stufe");
  return { text: joinZeilen(zeilen), stufe };
}

function sozialReflexionSpeichern(text, refText, tagIso) {
  const tag = tagIso || iso(heute());
  refText = (refText || "").replace(/\r/g, "").trim();
  if (!refText) throw new Error("Leere Reflexion bringt nichts.");
  const zeilen = sozialZeilen(text);
  const i = sektionSichern(zeilen, "Reflexionen");
  const ende = sektionEnde(zeilen, i);
  const kopf = "### " + tag;
  let block = null;
  for (let j = i + 1; j < ende; j++) {
    if (zeilen[j].trim() === kopf) { block = j; break; }
  }
  const neu = refText.split("\n");
  if (block === null) {
    sozialAnhaengen(zeilen, "Reflexionen", [kopf].concat(neu));
  } else {
    let bende = ende;
    for (let j = block + 1; j < ende; j++) {
      if (zeilen[j].trim().startsWith("### ")) { bende = j; break; }
    }
    while (bende > block + 1 && !zeilen[bende - 1].trim()) bende -= 1;
    for (let n = 0; n < neu.length; n++) zeilen.splice(bende + n, 0, neu[n]);
  }
  return { text: joinZeilen(zeilen), tag };
}

function sozialWoche(daten, tag) {
  tag = tag || heute();
  const montag = addDays(tag, -weekday(tag));
  const sonntag = addDays(montag, 6);
  const tage = new Set();
  for (const x of daten.log) {
    if (x.datum >= montag && x.datum <= sonntag) tage.add(iso(x.datum));
  }
  return { tage: tage.size, ziel: daten.wochenziel, heute: tage.has(iso(tag)) };
}

function sozialBilanz(daten) {
  const paare = daten.log.filter((x) => x.vorher !== null && x.nachher !== null);
  if (!paare.length) return { n: 0, vorher: 0.0, nachher: 0.0, leichter: 0 };
  return {
    n: paare.length,
    vorher: paare.reduce((a, x) => a + x.vorher, 0) / paare.length,
    nachher: paare.reduce((a, x) => a + x.nachher, 0) / paare.length,
    leichter: paare.filter((x) => x.nachher < x.vorher).length,
  };
}

function sozialWerkzeug(tag) {
  tag = tag || heute();
  const [j, w] = isoWoche(tag);
  return SOZIAL_WERKZEUGE[(j * 53 + w) % SOZIAL_WERKZEUGE.length];
}

function stufenKuerzel(daten) {
  for (const s of daten.stufen) {
    if (s.stufe === daten.stufe) return s.kuerzel;
  }
  return "";
}

function sozialBereitFuerMehr(daten) {
  const kz = stufenKuerzel(daten);
  const aktuelle = daten.log.filter((x) => x.kuerzel === kz && x.nachher !== null);
  const letzte = aktuelle.slice(-3);
  const hoeher = daten.stufen.filter((s) => s.stufe > daten.stufe);
  return letzte.length === 3 && letzte.every((x) => x.nachher <= 3) && hoeher.length > 0;
}

// ------------------------------------------------------------ Tagebuch

const ZIELE_RE = /####\s*(?:Ziele f[üu]r morgen|Was nehme ich mir f[üu]r morgen vor)[^\n]*\n([\s\S]*?)(?=\n####|$)/i;

// eintraege: [{datum, text}] aufsteigend sortiert.
function letzteZiele(eintraege) {
  for (let i = eintraege.length - 1; i >= 0; i--) {
    const m = nl(eintraege[i].text).match(ZIELE_RE);
    if (!m) continue;
    const zeilen = m[1].split("\n").map((z) => z.trim()).filter(Boolean);
    if (zeilen.length) return { datum: eintraege[i].datum, ziele: zeilen };
  }
  return null;
}

const REF_RE = /(?<!\[)\[([^\[\]\n]{1,60})\](?!\]|\()/g;
const NAME_VERBOTEN = /[\\/:*?"<>|#^]/;

// vorhanden: Map lowercase-Name -> Originalname. Neue Stubs kommen in
// angelegt, der Aufrufer legt die Dateien an. Gibt {text, angelegt} zurueck.
function refsAufloesen(text, vorhanden) {
  text = nl(text);
  const angelegt = [];
  const neu = text.replace(REF_RE, (ganz, rohRaw) => {
    const roh = rohRaw.trim();
    if (!roh || roh.toLowerCase() === "x") return ganz;
    if (NAME_VERBOTEN.test(roh)) return ganz;
    const treffer = vorhanden.get(roh.toLowerCase());
    if (treffer) return "[[" + treffer + "]]";
    const name = /[a-zäöüß]/.test(roh[0]) ? roh[0].toUpperCase() + roh.slice(1) : roh;
    if (!vorhanden.has(name.toLowerCase())) {
      angelegt.push(name);
      vorhanden.set(name.toLowerCase(), name);
    }
    return "[[" + name + "]]";
  });
  return { text: neu, angelegt };
}

// schlagworte: [[begriff, notiz]] laengste zuerst (aus parseSchlagworte).
function parseSchlagworte(text) {
  if (text.includes("---")) text = text.split("---").slice(1).join("---");
  const raus = [];
  let fence = false;
  for (const zeile of nl(text).split("\n")) {
    const z = zeile.trim();
    if (z.startsWith("```")) { fence = !fence; continue; }
    if (fence || !z || z.startsWith("#") || z.startsWith("<!--") || z.startsWith(">")) continue;
    let begriff, notiz;
    if (z.includes("|")) {
      const idx = z.indexOf("|");
      begriff = z.slice(0, idx).trim();
      notiz = z.slice(idx + 1).trim();
    } else {
      begriff = notiz = z;
    }
    if (begriff && notiz && begriff.length >= 2) raus.push([begriff, notiz]);
  }
  raus.sort((a, b) => b[0].length - a[0].length);
  return raus;
}

function autoRefs(text, worte, vorhanden) {
  text = nl(text);
  if (!worte.length) return { text, angelegt: [] };
  const angelegt = [];

  const gesperrt = [];
  for (const m of text.matchAll(/\[\[[^\]]*\]\]|\[[^\]\n]*\](\([^)]*\))?|`[^`\n]*`/g)) {
    gesperrt.push([m.index, m.index + m[0].length]);
  }
  const frei = (a, b) => gesperrt.every(([s, e]) => b <= s || a >= e);

  const einfuegungen = [];
  const schon = new Set();
  for (const m of text.matchAll(/\[\[([^\]|#]+)/g)) {
    schon.add(m[1].trim().toLowerCase());
  }
  for (const [begriff, notiz] of worte) {
    if (schon.has(notiz.toLowerCase())) continue;
    const muster = new RegExp("(?<![\\p{L}\\p{N}_])" + escapeRe(begriff) + "(?![\\p{L}\\p{N}_])", "giu");
    for (const m of text.matchAll(muster)) {
      const a = m.index, b = m.index + m[0].length;
      if (!frei(a, b)) continue;
      if (einfuegungen.some(([ea, eb]) => !(b <= ea || a >= eb))) continue;
      let ziel = vorhanden.get(notiz.toLowerCase());
      if (!ziel) {
        if (NAME_VERBOTEN.test(notiz)) break;
        angelegt.push(notiz);
        vorhanden.set(notiz.toLowerCase(), notiz);
        ziel = notiz;
      }
      const roh = text.slice(a, b);
      const ersatz = roh === ziel ? "[[" + ziel + "]]" : "[[" + ziel + "|" + roh + "]]";
      einfuegungen.push([a, b, ersatz]);
      schon.add(notiz.toLowerCase());
      break;
    }
  }
  einfuegungen.sort((x, y) => y[0] - x[0] || y[1] - x[1]);
  for (const [a, b, ersatz] of einfuegungen) {
    text = text.slice(0, a) + ersatz + text.slice(b);
  }
  return { text, angelegt };
}

const TB_ABSCHNITTE = [
  "Was habe ich heute gemacht:",
  "Was habe ich heute gelernt:",
  "Was habe ich produktives gemacht:",
  "Was kann man verbessern:",
];
const TB_MORGEN = "Was nehme ich mir für morgen vor:";

// Cans Vorlage: leere Abschnitte, die er ausfuellt. Wie aktionen.tagebuch_vorlage.
function tagebuchVorlage(tag) {
  const morgen = addDays(tag, 1);
  const teile = ["[[Tagebuch]]", ""];
  for (const k of TB_ABSCHNITTE) teile.push("#### " + k, "", "");
  teile.push("#### " + TB_MORGEN + " [[" + punktDatum(morgen) + "]]", "", "");
  return teile.join("\n");
}

// Schreibt den Eintrag komplett neu, wie aktionen.tagebuch_speichern.
// Das ist gewollt: direkt in der Datei editieren, git sichert jeden Stand.
function tagebuchSpeichern(text, vorhanden, worte) {
  text = nl(text);
  if (text.length > 200000) throw new Error("Eintrag zu lang");
  const r1 = refsAufloesen(text, vorhanden);
  const r2 = autoRefs(r1.text, worte, vorhanden);
  return { content: rstripNl(r2.text) + "\n", angelegt: r1.angelegt.concat(r2.angelegt) };
}

// Legt den Eintrag an oder haengt an. Gibt {content, angelegt} zurueck.
// altText null oder leer heisst: neue Datei mit Vorlage (ohne Commits).
function tagebuchAnlegen(altText, text, tag, vorhanden, worte) {
  text = nl(text).trim();
  if (!text) throw new Error("Leerer Eintrag");
  if (text.length > 100000) throw new Error("Eintrag zu lang");
  const r1 = refsAufloesen(text, vorhanden);
  const r2 = autoRefs(r1.text, worte, vorhanden);
  text = r2.text;
  const angelegt = r1.angelegt.concat(r2.angelegt);

  if (altText && altText.trim()) {
    altText = nl(altText);
    const m = altText.match(/\n####\s*Was habe ich heute gelernt/);
    let neu;
    if (m) {
      neu = rstripNl(altText.slice(0, m.index)) + "\n\n" + text + altText.slice(m.index);
    } else {
      neu = rstripNl(altText) + "\n\n" + text + "\n";
    }
    return { content: neu, angelegt, neuDatei: false };
  }
  const morgen = addDays(tag, 1);
  const teile = ["[[Tagebuch]]", "", text, "",
    "#### Was habe ich heute gelernt:", "", "",
    "#### Ziele für morgen [[" + punktDatum(morgen) + "]]:", ""];
  return { content: teile.join("\n"), angelegt, neuDatei: true };
}

// ----------------------------------------------------------- Training

const TRAINING_LOG_RE = /^\s*(\d{4}-\d{2}-\d{2})\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(.*?)\s*$/;
const TRAINING_SATZ_RE = /^(?:(\d+(?:\.\d+)?)x)?(\d+)$/;

function trainingZeilen(text) {
  let zeilen = text ? zeilenAus(text) : [];
  if (!zeilen.length || (zeilen.length === 1 && !zeilen[0])) {
    zeilen = ["# Training", "", "---", "", "## Tage", "", "## Übungen", "", "## Log"];
  }
  return zeilen;
}

function trainingDatenzeilen(zeilen, i, ende) {
  const raus = [];
  let komm = false;
  for (let j = i + 1; j < ende; j++) {
    const s = zeilen[j].trim();
    if (komm) { if (s.includes("-->")) komm = false; continue; }
    if (s.startsWith("<!--")) { if (!s.includes("-->")) komm = true; continue; }
    if (!s || s === "---") continue;
    raus.push(j);
  }
  return raus;
}

function trainingSaetzeParsen(text) {
  const saetze = [];
  for (const teil of String(text == null ? "" : text).split(",")) {
    const m = teil.trim().match(TRAINING_SATZ_RE);
    if (!m) continue;
    saetze.push({ gewicht: m[1] ? parseFloat(m[1]) : null, wdh: parseInt(m[2], 10) });
  }
  return saetze;
}

function trainingGewichtText(g) {
  // Python "%g" % round(g, 2)
  return String(Math.round(g * 100) / 100);
}

function trainingSatzText(s) {
  if (s.gewicht === null) return String(s.wdh);
  return trainingGewichtText(s.gewicht) + "x" + s.wdh;
}

function trainingLogzeile(datum, tag, uebung, saetze) {
  return datum + " | " + tag + " | " + uebung + " | " + saetze.map(trainingSatzText).join(", ");
}

function parseTraining(text) {
  const ab = abschnitte(text);
  const tage = [];
  for (const z of ab["Tage"] || []) {
    const name = z.trim();
    if (name && !tage.some((t) => t.toLowerCase() === name.toLowerCase())) tage.push(name);
  }
  const uebungen = {};
  for (const t of tage) uebungen[t] = [];
  for (const z of ab["Übungen"] || []) {
    if (!z.includes("|")) continue;
    const i = z.indexOf("|");
    const tag = z.slice(0, i).trim(), name = z.slice(i + 1).trim();
    const ziel = tage.find((t) => t.toLowerCase() === tag.toLowerCase());
    if (!ziel || !name) continue;
    if (!uebungen[ziel].some((u) => u.toLowerCase() === name.toLowerCase())) uebungen[ziel].push(name);
  }
  const log = [];
  for (const z of ab["Log"] || []) {
    const m = z.match(TRAINING_LOG_RE);
    if (!m) continue;
    const d = parseDateIso(m[1]);
    if (!d) continue;
    const saetze = trainingSaetzeParsen(m[4]);
    if (!saetze.length) continue;
    log.push({ datum: d, tag: m[2], uebung: m[3], saetze });
  }
  log.sort((a, b) => a.datum - b.datum);
  return { tage, uebungen, log };
}

function trainingName(name, maxlen, was) {
  name = String(name == null ? "" : name).trim().replace(/\|/g, "/").replace(/\s{2,}/g, " ");
  if (!name) throw new Error("Leerer " + was);
  if (name.length > maxlen) throw new Error(was + " zu lang");
  if (name.startsWith("#")) throw new Error("Ungueltiger Name: " + name);
  return name;
}

function trainingTagFinden(daten, tag) {
  const ziel = daten.tage.find((t) => t.toLowerCase() === String(tag == null ? "" : tag).trim().toLowerCase());
  if (!ziel) throw new Error("Tag gibt es nicht: " + tag);
  return ziel;
}

function trainingTagAnlegen(text, name) {
  name = trainingName(name, 40, "Tagname");
  const daten = parseTraining(text);
  for (const t of daten.tage) {
    if (t.toLowerCase() === name.toLowerCase()) return { text: nl(text), name: t };
  }
  const zeilen = trainingZeilen(text);
  sozialAnhaengen(zeilen, "Tage", [name]);
  return { text: joinZeilen(zeilen), name };
}

function trainingTagOben(text, name) {
  const zeilen = trainingZeilen(text);
  const i = sektionIndex(zeilen, "Tage");
  if (i === null) throw new Error("Tag nicht gefunden: " + name);
  const daten = trainingDatenzeilen(zeilen, i, sektionEnde(zeilen, i));
  const ziel = String(name == null ? "" : name).trim().toLowerCase();
  let treffer = null;
  for (const j of daten) {
    if (zeilen[j].trim().toLowerCase() === ziel) { treffer = j; break; }
  }
  if (treffer === null) throw new Error("Tag nicht gefunden: " + name);
  const kanon = zeilen[treffer].trim();
  if (treffer === daten[0]) return { text: nl(text), name: kanon };
  const zeile = zeilen.splice(treffer, 1)[0];
  zeilen.splice(daten[0], 0, zeile);
  return { text: joinZeilen(zeilen), name: kanon };
}

function trainingUebungAnlegen(text, tag, name) {
  name = trainingName(name, 60, "Uebungsname");
  const daten = parseTraining(text);
  const ziel = trainingTagFinden(daten, tag);
  for (const u of daten.uebungen[ziel]) {
    if (u.toLowerCase() === name.toLowerCase()) return { text: nl(text), name: u };
  }
  const zeilen = trainingZeilen(text);
  sozialAnhaengen(zeilen, "Übungen", [ziel + " | " + name]);
  return { text: joinZeilen(zeilen), name };
}

function trainingUebungLoeschen(text, tag, name) {
  const zeilen = trainingZeilen(text);
  const i = sektionIndex(zeilen, "Übungen");
  if (i !== null) {
    const tagZiel = String(tag == null ? "" : tag).trim().toLowerCase();
    const nameZiel = String(name == null ? "" : name).trim().toLowerCase();
    for (const j of trainingDatenzeilen(zeilen, i, sektionEnde(zeilen, i))) {
      if (!zeilen[j].includes("|")) continue;
      const k = zeilen[j].indexOf("|");
      const t = zeilen[j].slice(0, k), u = zeilen[j].slice(k + 1);
      if (t.trim().toLowerCase() === tagZiel && u.trim().toLowerCase() === nameZiel) {
        const weg = u.trim();
        zeilen.splice(j, 1);
        if (j > 0 && j < zeilen.length && !zeilen[j].trim() && !zeilen[j - 1].trim()) {
          zeilen.splice(j, 1);
        }
        return { text: joinZeilen(zeilen), name: weg };
      }
    }
  }
  throw new Error("Uebung nicht gefunden: " + name);
}

function trainingLogtreffer(zeilen, datum, tag, uebung) {
  const i = sektionIndex(zeilen, "Log");
  if (i === null) return null;
  for (const j of trainingDatenzeilen(zeilen, i, sektionEnde(zeilen, i))) {
    const m = zeilen[j].match(TRAINING_LOG_RE);
    if (m && m[1] === datum && m[2].trim().toLowerCase() === tag.toLowerCase()
        && m[3].trim().toLowerCase() === uebung.toLowerCase()) return j;
  }
  return null;
}

function trainingSatz(text, tag, uebung, gewicht, wdh, tagIso) {
  tagIso = tagIso || iso(heute());
  const daten = parseTraining(text);
  const ziel = trainingTagFinden(daten, tag);
  const ueb = daten.uebungen[ziel].find(
    (u) => u.toLowerCase() === String(uebung == null ? "" : uebung).trim().toLowerCase());
  if (!ueb) throw new Error("Uebung gibt es nicht: " + uebung);

  let g = null;
  const gs = String(gewicht == null ? "" : gewicht).trim();
  if (gs) {
    g = Number(gs.replace(/,/g, "."));
    if (!isFinite(g) || !(g > 0 && g <= 999)) throw new Error("Kein Gewicht: " + gewicht);
  }
  const ws = String(wdh == null ? "" : wdh).trim();
  if (!/^[+-]?\d+$/.test(ws)) throw new Error("Keine Wiederholungen: " + wdh);
  const w = parseInt(ws, 10);
  if (!(w > 0 && w <= 999)) throw new Error("Keine Wiederholungen: " + wdh);

  const zeilen = trainingZeilen(text);
  const treffer = trainingLogtreffer(zeilen, tagIso, ziel, ueb);
  let saetze = [];
  if (treffer !== null) {
    saetze = trainingSaetzeParsen(zeilen[treffer].match(TRAINING_LOG_RE)[4]);
  }
  saetze.push({ gewicht: g, wdh: w });
  const neu = trainingLogzeile(tagIso, ziel, ueb, saetze);
  if (treffer !== null) zeilen[treffer] = neu;
  else sozialAnhaengen(zeilen, "Log", [neu]);
  return { text: joinZeilen(zeilen), zeile: neu, saetze: saetze.map(trainingSatzText) };
}

function trainingSatzWeg(text, tag, uebung, tagIso) {
  tagIso = tagIso || iso(heute());
  const daten = parseTraining(text);
  const ziel = trainingTagFinden(daten, tag);
  const ueb = String(uebung == null ? "" : uebung).trim();
  const zeilen = trainingZeilen(text);
  const treffer = trainingLogtreffer(zeilen, tagIso, ziel, ueb);
  if (treffer === null) throw new Error("Heute ist nichts eingetragen");
  const m = zeilen[treffer].match(TRAINING_LOG_RE);
  const saetze = trainingSaetzeParsen(m[4]);
  saetze.pop();
  if (saetze.length) {
    zeilen[treffer] = trainingLogzeile(tagIso, m[2].trim(), m[3].trim(), saetze);
  } else {
    zeilen.splice(treffer, 1);
    if (treffer > 0 && treffer < zeilen.length && !zeilen[treffer].trim()
        && !zeilen[treffer - 1].trim()) {
      zeilen.splice(treffer, 1);
    }
  }
  return { text: joinZeilen(zeilen), saetze: saetze.map(trainingSatzText) };
}
